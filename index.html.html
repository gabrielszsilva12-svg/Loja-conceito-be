<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CONCEITO BE | Coworking Pro BE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
  --bg:#f7f7f6;
  --surface:#ffffff;
  --surface-soft:#fafafa;
  --line:#e8e8e6;
  --line-strong:#dededb;
  --text:#111111;
  --muted:#737373;
  --black:#111111;
  --hover:#f3f3f1;
  --radius:12px;
}
body{
  margin:0;
  font-family:N27,Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit;font-family:N27,Inter,Arial,sans-serif}
button{cursor:pointer}
button,input,select,textarea{font:inherit;font-family:N27,Inter,Arial,sans-serif}
button{cursor:pointer}

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px
}

.status{
  padding:7px 12px;
  border-radius:20px;
  background:#dcfce7;
  color:#15803d;
  font-size:12px;
  font-weight:800
}

.status.offline{
  background:#fff7ed;
  color:#c2410c
}

.container{
  max-width:1500px;
  margin:auto;
  padding:20px 24px
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap
}

.tabs{
  display:flex;
  gap:6px
}

.tab{
  border:0;
  background:#eeeeec;
  padding:9px 16px;
  border-radius:10px;
  font-weight:700
}

.tab.active{
  background:#111;
  color:#fff
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.btn{
  border:1px solid var(--line-strong);
  background:#fff;
  padding:9px 14px;
  border-radius:10px;
  font-weight:700
}

.btn{transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.btn:hover{background:#f3f3f1;border-color:#d4d4d1;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

.btn-primary{
  background:#111;
  color:#fff;
  border-color:#000000
}

.btn-danger{
  color:#dc2626;
  border-color:#fecaca
}

.week-controls{
  display:flex;
  align-items:center;
  gap:8px
}

.week-controls input,
.date-input{
  padding:9px 11px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  background:#fff
}

/* CALENDÁRIO */

.calendar-wrapper{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:auto;
  box-shadow:0 2px 12px rgba(0,0,0,.035)
}

.calendar{
  min-width:950px;
  display:grid;
  grid-template-columns:75px repeat(7,1fr)
}

.grid-header{
  background:#fbfbfa;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:12px;
  text-align:center;
  font-weight:800;
  min-height:55px
}

.grid-header small{
  font-weight:500;
  color:#777
}

.time-slot{
  min-height:var(--slot-height,82px);
  height:var(--slot-height,82px);
  padding:12px 8px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#777;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line)
}

.day-cell{
  min-height:var(--slot-height,82px);
  height:var(--slot-height,82px);
  padding:5px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fff;
  position:relative;
  overflow:visible;
  /* z-index removido para o card sobrescrever as linhas de baixo corretamente */
}

.day-cell:hover{
  background:#fbfbfa
}

.event-card{
  background:#111;
  color:#fff;
  border-radius:10px;
  padding:8px;
  margin-bottom:4px;
  cursor:pointer;
  font-size:12px;
  white-space:normal; /* Permite que o texto quebre melhor */
}

.event-card:hover{
  opacity:.88
}

.event-title{
  font-weight:800;
  font-size:13px;
  margin-bottom:3px;
  line-height:1.2;
}

.event-time{
  opacity:.8;
  font-size:11px;
}

.event-owner{
  margin-top:3px;
  font-size:11px;
  opacity:.75;
}

/* ASSENTOS */

.seats-view{
  display:none
}

.seat-toolbar{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:20px
}

.room{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  box-shadow:0 2px 12px rgba(0,0,0,.035)
}

.room h3{
  margin:0 0 18px
}

.table{
  background:#ececea;;
  border-radius:10px;
  padding:12px;
  margin-bottom:22px
}

.table-name{
  text-align:center;
  font-weight:800;
  font-size:12px;
  margin-bottom:8px
}

.seats-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0
}

.seat-chair{
  width:115px;
  min-height:55px;
  border:1.5px solid #d7d7d4;
  border-radius:10px;
  background:#fbfbfa;
  padding:7px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:.15s
}

.seat-chair:hover{
  transform:translateY(-2px);
  border-color:#777
}

.seat-chair.occupied{
  background:#111;
  color:#fff;
  border-color:#000000
}

.seat-status{
  font-size:10px;
  margin-top:3px;
  text-align:center;
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

/* MODAIS */

.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.2)
}

.modal-header{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center
}

.modal-header h2{
  margin:0;
  font-size:19px
}

.close{
  border:0;
  background:none;
  font-size:25px;
  color:#777
}

.modal-body{
  padding:20px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px
}

.form-group.full{
  grid-column:1/-1
}

.form-group label{
  font-size:12px;
  font-weight:800;
  color:#475569
}

.form-group input,
.form-group select,
.form-group textarea{
  border:1px solid var(--line-strong);
  border-radius:10px;
  padding:10px;
  background:#fff
}

.form-group textarea{
  min-height:80px;
  resize:vertical
}

.modal-footer{
  padding:15px 20px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  gap:8px
}

.footer-right{
  display:flex;
  gap:8px
}

.empty-state{
  text-align:center;
  padding:30px;
  color:#777
}


.brand-area{display:flex;align-items:center;gap:12px}
.logo-upload{width:42px;height:42px;border:1.5px dashed #94a3b8;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#fbfbfa;flex:none}
.logo-upload input{display:none}
.logo-upload img{width:100%;height:100%;object-fit:contain}
.logo-upload span{font-size:24px;color:#777;font-weight:500}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.daily-calendar{min-width:650px;display:grid;grid-template-columns:75px 1fr}
.daily-calendar .day-cell{min-height:82px}
@media(max-width:700px){.brand-area{gap:8px}.logo{font-size:18px}.logo-upload{width:36px;height:36px}}

@media(max-width:700px){
  .container{padding:12px}
  .header{padding:0 14px}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}

/* Layout das mesas */
.room-layout{
  min-height:255px;
  padding:12px 6px;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:78px 92px 78px;
  align-items:center;
  justify-items:center;
  gap:0;
}
.room-table-shape{
  grid-column:1;
  grid-row:2;
  position:static;
  transform:none;
  width:150px;
  height:88px;
  border:2px solid #000;
  border-radius:6px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:12px;
  font-weight:900;
  z-index:1;
}
.room-table-shape span{color:#000}
.marketing-table{width:175px}
.seats-row{
  position:relative;
  z-index:3;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  width:100%;
}
.room-layout > .seats-row:nth-of-type(2){grid-column:1;grid-row:1}
.room-layout > .seats-row:nth-of-type(3){grid-column:1;grid-row:3}

/* AGENDA FULLSCREEN — semana e dia cabem na tela */
@media(min-width:900px){
  :root{
    --agenda-header-height:42px;
    --agenda-slot-height:calc((100vh - 190px) / 11);
  }

  .header{
    height:62px;
  }

  .container{
    padding:10px 24px 12px;
  }

  .toolbar{
    margin-bottom:8px;
  }

  #view-coworking > .toolbar{
    margin-bottom:8px;
  }

  .calendar-wrapper{
    height:calc(100vh - 145px);
    max-height:none;
    overflow:hidden;
  }

  .calendar,
  .daily-calendar{
    width:100%;
    min-width:0;
    height:100%;
    overflow:hidden;
    grid-template-rows:var(--agenda-header-height) repeat(11,minmax(0,1fr));
  }

  .calendar{
    grid-template-columns:64px repeat(7,minmax(0,1fr));
  }

  .daily-calendar{
    grid-template-columns:64px minmax(0,1fr);
  }

  .grid-header{
    min-height:0;
    height:100%;
    padding:5px 4px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    line-height:1.05;
  }

  .grid-header small{
    margin-top:3px;
  }

  .time-slot,
  .day-cell{
    min-height:0;
    height:100%;
  }

  .time-slot{
    padding:3px 4px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-size:10px;
  }

  .day-cell{
    padding:3px;
  }

  .event-card{
    padding:5px 6px;
    min-height:34px;
    font-size:10px;
    border-radius:7px;
  }

  .event-title{
    font-size:11px;
    line-height:1.1;
    margin-bottom:2px;
  }

  .event-time,
  .event-owner{
    font-size:9px;
    line-height:1.1;
  }

  .event-owner{
    margin-top:2px;
  }
}

/* Em telas menores, mantém rolagem horizontal apenas quando realmente necessária. */
@media(max-width:899px){
  .calendar-wrapper{
    overflow:auto;
  }
}

.event-card{padding:6px;font-size:11px}
  .event-title{font-size:12px}
  .event-owner{font-size:10px}
}

.event-card{
  position:absolute;
  left:4px;
  right:4px;
  margin:0;
  top:4px;
  min-height:28px;
  height:max(34px,calc(var(--event-duration-hours, 1) * var(--agenda-slot-height, 72px) - 8px));
  z-index:20;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.12);
}


.shift-panel{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:10px;
  margin-top:12px;
  background:#fbfbfa;
}
.shift-title{
  text-align:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
  margin-bottom:4px;
}
.shift-layout{
  min-height:210px;
  grid-template-rows:64px 82px 64px;
}
.shift-layout .seat-chair{
  width:105px;
  min-height:50px;
  font-size:11px;
}
.shift-layout .seat-status{font-size:9px}
@media(max-width:700px){.shift-layout .seat-chair{width:90px}}


/* UX DA AGENDA — leitura clara mesmo em períodos curtos */
.calendar-wrapper{scrollbar-width:thin}
.grid-header{
  position:sticky;
  top:0;
  z-index:8;
  background:#fbfbfa;
  color:#222;
  min-height:48px;
  padding:8px 6px;
}
.grid-header small{color:#8a8a87;font-size:10px}
.time-slot{
  background:#fcfcfb;
  font-size:11px;
  color:#8a8a87;
  padding:7px 5px;
  min-height:var(--slot-height,72px);
}
.day-cell{
  min-height:var(--slot-height,72px);
  height:var(--slot-height,72px);
  padding:4px;
  background:#fff;
}
.day-cell:hover{background:#fcfcfb}
.event-card{
  min-height:48px;
  height:max(48px,calc(var(--event-duration-hours,1) * var(--slot-height) - 8px));
  padding:7px 8px;
  border-radius:9px;
  background:#111;
  box-shadow:0 2px 8px rgba(0,0,0,.09);
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
}
.event-card:hover{
  opacity:1;
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(0,0,0,.13);
}
.event-title{font-size:12px;line-height:1.22}
.event-time{font-size:10px;margin-top:3px}
.event-owner{font-size:10px;margin-top:3px;opacity:.82}
@media(min-width:900px){
  :root{--slot-height:72px}
  .header{height:64px}
  .container{padding:14px 24px}
  .toolbar{margin-bottom:12px}
  .calendar-wrapper{max-height:calc(100vh - 138px)}
  .grid-header{min-height:44px;padding:7px 5px}
  .time-slot,.day-cell{min-height:var(--slot-height);height:var(--slot-height)}
  .event-card{padding:7px 8px}
  .event-title{font-size:12px}
  .event-owner{font-size:10px}
}


.tab,.btn,.date-input,.week-controls input,select,input,textarea{
  transition:border-color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease;
}
.tab:not(.active):hover{background:#e8e8e5}
.tab.active{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus,
.date-input:focus,.week-controls input:focus{
  outline:none;
  border-color:#aaa;
  box-shadow:0 0 0 3px rgba(0,0,0,.045);
}

</style>
</head>

<body>

<header class="header">
  <div class="brand-area">
    <label class="logo-upload" title="Adicionar logo">
      <input id="logo-input" type="file" accept="image/*" onchange="handleLogoUpload(event)">
      <img id="brand-logo" alt="Logo" style="display:none">
      <span id="logo-placeholder">+</span>
    </label>
    <div class="logo">LOJA CONCEITO BE</div>
  </div>

  <div class="header-right">
    <span id="connection-status" class="status offline">
      ● Carregando...
    </span>
  </div>
</header>

<main class="container">

  <div class="toolbar">

    <div class="tabs">
      <button id="btn-tab-coworking"
              class="tab active"
              onclick="switchTab('coworking')">
        Coworking Pro BE
      </button>

      <button id="btn-tab-seats"
              class="tab"
              onclick="switchTab('seats')">
        Mapeamento de lugares
      </button>
    </div>

    <div class="actions">

      <button class="btn"
              onclick="openCollabModal()">
        Colaboradores
      </button>

      <button class="btn" onclick="toggleAgendaView()" id="view-toggle-btn">
        Visualização: Semanal
      </button>

      <button class="btn" onclick="exportAgendaPNG()">
        Exportar PNG
      </button>

      <button class="btn btn-primary"
              onclick="openMeetingModal()">
        + Nova reunião
      </button>

    </div>
  </div>

  <!-- AGENDA -->

  <section id="view-coworking">

    <div class="toolbar">

      <div class="week-controls">

        <button class="btn"
                onclick="changePeriod(-1)">
          ←
        </button>

        <input id="week-picker"
               type="date"
               onchange="renderDashboard()">

        <button class="btn"
                onclick="changePeriod(1)">
          →
        </button>

      </div>

      <strong id="week-label"></strong>

    </div>

    <div class="calendar-wrapper">

      <div id="weekly-table"
           class="calendar agenda-export-area">
      </div>

    </div>

  </section>

  <!-- MESAS -->

  <section id="view-seats"
           class="seats-view">

    <div class="seat-toolbar">

      <div>
        <strong>Mapa de mesas</strong>
        <div style="font-size:12px;color:#777">
          Clique em um assento para alocar ou editar.
        </div>
      </div>

      <div class="tabs" style="margin: 0 auto;">
         <button id="btn-shift-morning" class="tab active" onclick="toggleSeatShift('morning')">Manhã</button>
         <button id="btn-shift-afternoon" class="tab" onclick="toggleSeatShift('afternoon')">Tarde</button>
      </div>

      <input id="seat-search-date"
             class="date-input"
             type="date"
             onchange="renderSeats()">

    </div>

    <div class="rooms">

      <div class="room">
        <h3>Meeting 01</h3>

        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 01</span></div>
            <div id="m1-morning-top" class="seats-row"></div>
            <div id="m1-morning-bottom" class="seats-row"></div>
          </div>
        </div>

        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 01</span></div>
            <div id="m1-afternoon-top" class="seats-row"></div>
            <div id="m1-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

      <div class="room">
        <h3>Meeting 02</h3>

        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 02</span></div>
            <div id="m2-morning-top" class="seats-row"></div>
            <div id="m2-morning-bottom" class="seats-row"></div>
          </div>
        </div>

        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 02</span></div>
            <div id="m2-afternoon-top" class="seats-row"></div>
            <div id="m2-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

      <div class="room">
        <h3>Mesa Marketing</h3>

        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape marketing-table"><span>MARKETING</span></div>
            <div id="m3-morning-top" class="seats-row"></div>
            <div id="m3-morning-bottom" class="seats-row"></div>
          </div>
        </div>

        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape marketing-table"><span>MARKETING</span></div>
            <div id="m3-afternoon-top" class="seats-row"></div>
            <div id="m3-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

    </div>

  </section>

</main>

<!-- MODAL REUNIÃO -->

<div id="meeting-modal"
     class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modal-title-text">
        Agendar Reunião
      </h2>

      <button class="close"
              onclick="closeMeetingModal()">
        ×
      </button>

    </div>

    <form id="meeting-form"
          onsubmit="saveMeeting(event)">

      <div class="modal-body">

        <input id="m-id"
               type="hidden">

        <div class="form-grid">

          <div class="form-group full" style="display:flex; gap:14px; flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:120px;">
               <label>Time</label>
               <select id="m-team-select"></select>

function localDateString(date = new Date()) {

  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;

}

function dateFromInput(value) {

  return new Date(`${value}T00:00:00`);

function addDays(date,amount) {

  const d = new Date(date);

  d.setDate(d.getDate()+amount);

  return d;

}

function startOfWeek(date) {

  const d = new Date(date);

  const day = d.getDay();

  d.setDate(d.getDate() - day);

  d.setHours(0,0,0,0);

  return d;

}

function minutes(time) {

  const [h,m] =
    String(time || '')
      .slice(0,5)
      .split(':')
      .map(Number);

  return (h || 0)*60 + (m || 0);

}

function esc(value) {

  return String(value ?? '')
    .replace(/[&<>"']/g,char => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[char]));

}

function setStatus(text,connected) {

  if(!element) return;

========================= */

async function loadData(){

  if(!db) return;

  const [
    collaboratorsResult,
    meetingsResult,
    seatsResult
  ] = await Promise.all([

    db
      .from('collaborators')
      .select('*')
      .order('name'),

    db
      .from('meetings')
      .select('*')
      .order('date')
      .order('start'),

    db
      .from('seat_allocations')
      .select('*')
      .order('startDate')

  ]);

  if(collaboratorsResult.error)
    throw collaboratorsResult.error;

  if(meetingsResult.error)
    throw meetingsResult.error;

  if(seatsResult.error)
    throw seatsResult.error;

  collaborators =
    collaboratorsResult.data || [];

  meetings =
    meetingsResult.data || [];

  seatAllocations =
    seatsResult.data || [];

  renderDashboard();
  renderSeats();

}

function setupRealtime(){

  if(
    !db ||
    realtimeChannels.length
  ) return;

  [
    'collaborators',
    'meetings',
    'seat_allocations'

  ].forEach(table => {

    const channel =
      db
        .channel(
          `be-${table}-${Date.now()}`
        )
        .on(
          'postgres_changes',
          {
            event:'*',
            schema:'public',
            table
          },
          async () => {

            try{

              await loadData();

              setStatus(
                '● Sincronizado',
                true
              );

            }catch(error){

              console.error(error);

              setStatus(
                '● Sem conexão',
                false
              );

            }

          }
        )
        .subscribe();

    realtimeChannels.push(channel);

  });

}

function changePeriod(amount){
  const input = $('week-picker');
  const date = dateFromInput(input.value || localDateString());
  date.setDate(date.getDate() + amount * (agendaView === 'weekly' ? 7 : 1));
  input.value = localDateString(date);
  renderDashboard();
}

function changeWeek(amount){ changePeriod(amount); }

function meetingOccursOnDate(
  meeting,
  targetDate
){

  if(
    !meeting ||
    !meeting.date
  ) return false;

  const start =
    dateFromInput(
      meeting.date
    );

  const target =
    dateFromInput(
      targetDate
    );

  if(target < start)
    return false;

  switch(
    meeting.recurrence ||
    'none'
  ){

    case 'none':

      return (
        meeting.date ===
        targetDate
      );

    case 'daily':

      return (
        target.getDay() >= 1 &&
        target.getDay() <= 5
      );

    case 'weekly':

      return (
        target.getDay() ===
        start.getDay()
      );

    case 'biweekly':{

      const difference =
        Math.floor(
          (target-start) /
          86400000
        );

      return (
        difference >= 0 &&
        difference % 14 === 0
      );

    }

    case 'monthly':

      return (
        target.getDate() ===
        start.getDate()
      );

    default:

      return false;

  }

}

function syncAgendaViewport(){
  const calendar = $('weekly-table');
  const wrapper = document.querySelector('.calendar-wrapper');
  if(!calendar || !wrapper) return;

  if(window.innerWidth >= 900){
    const header = calendar.querySelector('.grid-header');
    const headerHeight = header ? header.getBoundingClientRect().height : 42;
    const available = Math.max(40, wrapper.clientHeight - headerHeight);
    const slotHeight = available / 11;
    calendar.style.setProperty('--agenda-slot-height', `${slotHeight}px`);
  }else{
    calendar.style.removeProperty('--agenda-slot-height');
  }
}

window.addEventListener('resize', syncAgendaViewport);

function renderDashboard(){

  const container = $('weekly-table');
  if(!container) return;

  const selected = $('week-picker').value || localDateString();
  const selectedDate = dateFromInput(selected);

  function eventMarkup(meeting, hourStart){
    const start = minutes(meeting.start);
    const end = minutes(meeting.end);
    const safeEnd = Math.max(end, start + 15);
    const durationHours = (safeEnd - start) / 60;
    const offsetPercent = ((start - hourStart) / 60) * 100;
    const encoded = encodeURIComponent(JSON.stringify(meeting));
    const typeBadge = meeting.type === 'Externa' ? '<span style="color:#fca5a5">[Ext]</span> ' : '';
    const teamBadge = meeting.team ? `${esc(meeting.team)} | ` : '';

    return `<div class="event-card"
      style="top:${Math.max(0,offsetPercent)}%;--event-duration-hours:${durationHours};"
      onclick="event.stopPropagation();openMeetingModalFromEncoded('${encoded}')">
      <div class="event-title">${typeBadge}${teamBadge}${esc(meeting.title)}</div>
      <div class="event-time">${esc(String(meeting.start || '').slice(0,5))} - ${esc(String(meeting.end || '').slice(0,5))}</div>
      <div class="event-owner">${meeting.owner ? 'Responsável: ' + esc(meeting.owner) : 'Responsável: —'}</div>
    </div>`;
  }

  if(agendaView === 'daily'){

    const target = localDateString(selectedDate);
    const dayName = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][selectedDate.getDay()];

    $('week-label').textContent =
      `${dayName} - ${pad(selectedDate.getDate())}/${pad(selectedDate.getMonth()+1)}`;

    let html = '<div class="grid-header">Hora</div>';
    html += `<div class="grid-header"><strong>${dayName}</strong><br><small>${pad(selectedDate.getDate())}/${pad(selectedDate.getMonth()+1)}</small></div>`;

    hours.forEach(hour => {

      const hourStart = minutes(hour);
      const hourEnd = hourStart + 60;

      html += `<div class="time-slot">${hour}</div>`;

      const events = meetings
        .filter(m => meetingOccursOnDate(m,target))
        .filter(m => {
          const start = minutes(m.start);
          return start >= hourStart && start < hourEnd;
        })
        .sort((a,b) => minutes(a.start) - minutes(b.start));

      html += `<div class="day-cell" onclick="handleSlotClick('${target}','${hour}')">`;
      events.forEach(meeting => html += eventMarkup(meeting, hourStart));
      html += '</div>';
    });

    container.className = 'calendar agenda-export-area daily-calendar';
    container.innerHTML = html;
    requestAnimationFrame(syncAgendaViewport);
    return;
  }

  const sunday = startOfWeek(selectedDate);
  const days = Array.from({length:7},(_,index)=>addDays(sunday,index));

  $('week-label').textContent =
    `${pad(days[0].getDate())}/${pad(days[0].getMonth()+1)} - ${pad(days[6].getDate())}/${pad(days[6].getMonth()+1)}`;

  let html = '<div class="grid-header">Hora</div>';
  const names = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  days.forEach((day,index) => {
    html += `<div class="grid-header"><strong>${names[index]}</strong><br><small>${pad(day.getDate())}/${pad(day.getMonth()+1)}</small></div>`;
  });

  hours.forEach(hour => {

    const hourStart = minutes(hour);
    const hourEnd = hourStart + 60;

    html += `<div class="time-slot">${hour}</div>`;

    days.forEach(day => {

      const target = localDateString(day);

      const events = meetings
        .filter(meeting => meetingOccursOnDate(meeting,target))
        .filter(meeting => {
          const start = minutes(meeting.start);
          return start >= hourStart && start < hourEnd;
        })
        .sort((a,b) => minutes(a.start) - minutes(b.start));

      html += `<div class="day-cell" onclick="handleSlotClick('${target}','${hour}')">`;
      events.forEach(meeting => html += eventMarkup(meeting, hourStart));
      html += '</div>';
    });
  });

  container.className = 'calendar agenda-export-area';
  container.innerHTML = html;
  requestAnimationFrame(syncAgendaViewport);
}

function meetingConflict(
  candidate,
  editingId = ''
){

  const start =
    minutes(
      candidate.start
    );

  const end =
    minutes(
      candidate.end
    );

  if(end <= start){

    return (
      'O horário final deve ser maior ' +
      'que o horário inicial.'
    );

  }

  /*
    Verifica 1 ano para frente.
    Assim uma recorrência não consegue
    colidir com outra recorrência.
  */

  const base =
    dateFromInput(
      candidate.date
    );

  for(
    let i=0;
    i<366;
    i++
  ){

    const day =
      localDateString(
        addDays(base,i)
      );

    if(
      !meetingOccursOnDate(
        candidate,
        day
      )
    ) continue;

    for(
      const existing of meetings
    ){

      if(
        editingId &&
        String(existing.id) ===
        String(editingId)
      )
        continue;

      if(
        !meetingOccursOnDate(
          existing,
          day
        )
      )
        continue;

      if(
        start <
        minutes(existing.end) &&

        end >
        minutes(existing.start)
      ){

        return `
          Conflito com "${existing.title}"
          em
          ${day.split('-').reverse().join('/')}
          (
          ${String(existing.start).slice(0,5)}
          -
          ${String(existing.end).slice(0,5)}
          ).
        `;

      }

    }

  }

  return null;

}

function seatOccursOnDate(
  allocation,
  targetDate
){

  const start =
    dateFromInput(
      allocation.startDate
    );

  const target =
    dateFromInput(
      targetDate
    );

  if(target < start)
    return false;

  const day =
    target.getDay();

  if(
    allocation.exceptDay &&
    allocation.exceptDay !== 'none' &&
    Number(
      allocation.exceptDay
    ) === day
  ){

    return false;

  }

  switch(
    allocation.recurrence ||
    'daily'
  ){

    case 'single':

      return (
        allocation.startDate ===
        targetDate
      );

    case 'daily':

      return (
        day >= 1 &&
        day <= 5
      );

    case 'weekly':

      return (
        day === start.getDay()
      );

    case 'biweekly':{

      const difference =
        Math.floor(
          (target-start) /
          86400000
        );

      return (
        difference >= 0 &&
        difference % 14 === 0
      );

    }

    default:

      return false;

  }

}

function storageTableId(table, period){
  return `${table}__${period}`;
}

function getSeatOccupant(
  table,
  seat,
  date,
  period = 'morning'
){

  const currentTableId = storageTableId(table, period);

  return seatAllocations
    .filter(allocation =>
      String(allocation.seatCode) === String(seat) &&
      (
        String(allocation.tableId) === currentTableId ||
        (period === 'morning' && String(allocation.tableId) === String(table))
      ) &&
      seatOccursOnDate(allocation,date)
    )
    .sort((a,b) =>
      String(b.startDate).localeCompare(String(a.startDate))
    )[0] || null;
}

){

  $('seat-modal').style.display = 'flex';
}

}

function seatConflict(candidate, editingId = ''){

  const base = dateFromInput(candidate.startDate);

  for(let i=0;i<366;i++){

    const day = localDateString(addDays(base,i));

    if(!seatOccursOnDate(candidate,day))
      continue;

    for(const existing of seatAllocations){

      if(editingId && String(existing.id) === String(editingId))
        continue;

      if(String(existing.tableId) !== String(candidate.tableId))
        continue;

      if(String(existing.seatCode) !== String(candidate.seatCode))
        continue;

      if(String(existing.period || 'morning') !== String(candidate.period || 'morning'))
        continue;

      if(seatOccursOnDate(existing,day))
        return true;
    }
  }

  return false;
}

async function saveSeatAllocation(event){

  event.preventDefault();

  if(!db){
    alert('Supabase indisponível.');
    return;
  }

  const id = $('s-existing-id').value;
  const table = $('s-table-id').value;
  const period = $('s-period').value || 'morning';

  const data = {
    tableId: storageTableId(table, period),
    seatCode: $('s-seat-code').value,
    collabName: $('s-collab-select').value,
    startDate: $('s-start-date').value,
    recurrence: $('s-recurrence').value,
    exceptDay: $('s-except-day').value,
    period
  };

  if(!data.collabName || !data.startDate){
    alert('Preencha colaborador e data.');
    return;
  }

  if(seatConflict(data,id)){
    alert(
      `Este assento já possui uma alocação conflitante no período da ${period === 'morning' ? 'manhã' : 'tarde'}.`
    );
    return;
  }

  try{

    let response;

    if(id){
      response = await db
        .from('seat_allocations')
        .update(data)
        .eq('id',id)
        .select()
        .single();
    }else{
      response = await db
        .from('seat_allocations')
        .insert([data])
        .select()
        .single();
    }

    if(response.error)
      throw response.error;

    closeSeatModal();
    await loadData();

  }catch(error){

    console.error(error);

    // Compatibilidade: a separação também está no tableId,
    // portanto o sistema continua funcionando sem a coluna "period".
    const message = String(error?.message || '').toLowerCase();

    if(message.includes('period') || message.includes('column') || message.includes('schema cache')){

      try{

        const fallbackData = {...data};
        delete fallbackData.period;

        let fallback;

        if(id){
          fallback = await db
            .from('seat_allocations')
            .update(fallbackData)
            .eq('id',id)
            .select()
            .single();
        }else{
          fallback = await db
            .from('seat_allocations')
            .insert([fallbackData])
            .select()
            .single();
        }

        if(fallback.error)
          throw fallback.error;

        closeSeatModal();
        await loadData();
        return;

      }catch(fallbackError){

        alert(
          'Erro ao salvar assento: ' +
          fallbackError.message
        );

        return;
      }
    }

    alert(
      'Erro ao salvar assento: ' +
      error.message
    );
  }
}

async function deleteCollaborator(id){

  const collaborator =
    collaborators.find(
      c =>
        String(c.id) ===
        String(id)
    );

  if(!collaborator)
    return;

  const hasMeeting =
    meetings.some(
      meeting =>
        meeting.owner ===
        collaborator.name
    );

  const hasSeat =
    seatAllocations.some(
      seat =>
        seat.collabName ===
        collaborator.name
    );

  if(
    !confirm(
      `Excluir ${collaborator.name}?\n\n` +
      `Os lugares ocupados por este colaborador também serão liberados.`
    )
  )
    return;

  if(!db)
    return;

  try{

    const {error: seatError} =
      await db
        .from('seat_allocations')
        .delete()
        .eq('collabName', collaborator.name);

    if(seatError)
      throw seatError;

    const {error} =
      await db
        .from('collaborators')
        .delete()
        .eq('id',id);

    if(error)
      throw error;

    await loadData();

    renderCollabList();
    renderSeats();

  }catch(error){

    alert(
      'Erro ao excluir colaborador: ' +
      error.message
    );

  }

}
