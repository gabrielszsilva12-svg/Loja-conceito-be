<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Conceito BE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0a0f1d;
      --primary-hover: #1e293b;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 30px; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    header h1 { font-size: 1.5rem; letter-spacing: 1.5px; color: var(--primary); font-weight: 900; text-transform: uppercase; }
    
    .header-actions { display: flex; gap: 10px; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 0px; }
    .tab-btn { padding: 10px 18px; border: none; background: none; font-size: 0.85rem; font-weight: 800; cursor: pointer; color: var(--text-muted); text-transform: uppercase; border-bottom: 3px solid transparent; margin-bottom: -2px; }
    .tab-btn.active { background-color: var(--primary); color: white; border-radius: 6px 6px 0 0; }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card h3 { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .card-subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px; }

    .btn { padding: 8px 16px; border: 1px solid var(--border-color); border-radius: 8px; background: white; cursor: pointer; font-size: 0.85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }

    /* TABELA DE GRADE SEMANAL */
    .schedule-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .schedule-grid { display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 1px; background: var(--border-color); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .grid-header { background: #f8fafc; padding: 10px; text-align: center; font-size: 0.75rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .time-slot { background: #ffffff; padding: 10px 4px; text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid #f1f5f9; }
    .day-cell { background: #ffffff; padding: 6px; min-height: 50px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    
    .event-card { background: #e0f2fe; border-left: 3px solid #0284c7; padding: 6px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-bottom: 4px; }
    .event-title { font-weight: 800; color: #0369a1; }
    .event-time { font-size: 0.68rem; color: #075985; }

    /* MODAL AJUSTADO */
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: #fff; border-radius: 12px; padding: 18px 22px; width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    .modal-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 12px; color: var(--primary); }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 800; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }

    /* MAPA DE ASSENTOS */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .room-title { font-size: 0.9rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; }
    .seat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .seat { border: 1px solid var(--border-color); padding: 14px; border-radius: 8px; text-align: center; cursor: pointer; background: #ffffff; font-weight: 700; font-size: 0.88rem; color: var(--primary); }
    .seat:hover { border-color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>LOJA CONCEITO BE</h1>
      <div class="header-actions">
        <button class="btn" onclick="openCollabModal()">👥 Colaboradores</button>
        <button class="btn btn-primary" onclick="openMeetingModal()">+ Novo Evento/Reunião</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="btn-tab-coworking" onclick="switchTab('coworking')">COWORKING PRO BE</button>
      <button class="tab-btn" id="btn-tab-seats" onclick="switchTab('seats')">ALOCAÇÃO DE ASSENTOS</button>
    </div>

    <!-- ABA: COWORKING -->
    <div id="view-coworking" class="tab-content">
      <div class="card">
        <h3>Dashboard Semanal de Ocupação</h3>
        <p class="card-subtitle">Selecione o período para visualizar os agendamentos da sala.</p>
        
        <div class="schedule-controls">
          <div class="form-group" style="margin: 0; width: auto;">
            <input type="date" id="week-picker" onchange="renderDashboard()">
          </div>
        </div>

        <div class="schedule-grid" id="weekly-table"></div>
      </div>
    </div>

    <!-- ABA: ASSENTOS -->
    <div id="view-seats" class="tab-content" style="display:none;">
      <div class="card">
        <h3>Mapa de Alocação do Escritório</h3>
        <div class="form-group" style="max-width: 200px; margin-top: 10px; margin-bottom: 20px;">
          <label>Data</label>
          <input type="date" id="seat-search-date" onchange="renderSeats()">
        </div>
        <div class="grid-2">
          <div>
            <div class="room-title">MEETING #01 (4 LUGARES)</div>
            <div class="seat-grid" id="seats-m1"></div>
          </div>
          <div>
            <div class="room-title">MEETING #02 (4 LUGARES)</div>
            <div class="seat-grid" id="seats-m2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE REUNIÃO -->
  <div class="modal-backdrop" id="meeting-modal">
    <div class="modal">
      <div class="modal-title" id="modal-title-text">Agendar Reunião</div>
      <form id="meeting-form" onsubmit="saveMeeting(event)">
        <input type="hidden" id="m-id">
        
        <div class="form-group">
          <label>Título da Reunião *</label>
          <input type="text" id="m-title" required placeholder="Ex: Alinhamento Trade">
        </div>

        <div style="display: flex; gap: 8px;">
          <div class="form-group" style="flex: 2;">
            <label>Responsável *</label>
            <select id="m-owner-select" required></select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Pessoas *</label>
            <input type="number" id="m-attendees" min="1" value="1" required placeholder="Qtd">
          </div>
        </div>

        <div class="form-group">
          <label>Participantes (Separados por vírgula)</label>
          <input type="text" id="m-participants" placeholder="Ex: Ana, Carlos, Pedro">
        </div>

        <div class="form-group">
          <label>Data *</label>
          <input type="date" id="m-date" required>
        </div>

        <div style="display: flex; gap: 8px;">
          <div class="form-group" style="flex: 1;">
            <label>Início *</label>
            <input type="time" id="m-start" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Término *</label>
            <input type="time" id="m-end" required>
          </div>
        </div>

        <div class="form-group">
          <label>Recorrência</label>
          <select id="m-recurrence">
            <option value="none">Apenas nesta data (Única)</option>
            <option value="daily">Diário</option>
            <option value="weekly">Semanal</option>
            <option value="biweekly">A cada 15 dias</option>
            <option value="monthly">Mensal</option>
          </select>
        </div>

        <div class="form-group">
          <label>Exceto no dia da semana (Home Office)</label>
          <select id="m-except-day">
            <option value="none">Nenhuma exceção</option>
            <option value="1">Segunda-feira</option>
            <option value="2">Terça-feira</option>
            <option value="3">Quarta-feira</option>
            <option value="4">Quinta-feira</option>
            <option value="5">Sexta-feira</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" style="color:#ef4444; display:none;" id="btn-delete-meeting" onclick="deleteMeeting()">Excluir</button>
          <button type="button" class="btn" onclick="closeMeetingModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Reunião</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE COLABORADORES -->
  <div class="modal-backdrop" id="collab-modal">
    <div class="modal">
      <div class="modal-title">Gerenciar Colaboradores</div>
      <form onsubmit="saveCollaborator(event)">
        <div class="form-group">
          <label>Nome do Colaborador *</label>
          <input type="text" id="c-name" required placeholder="Nome completo">
        </div>
        <div class="form-group">
          <label>Time / Setor *</label>
          <select id="c-team" required>
            <option value="EDFE">EDFE</option>
            <option value="CEO">CEO</option>
            <option value="CSUA">CSUA</option>
            <option value="MARKETING">MARKETING</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:5px;">+ Adicionar Colaborador</button>
      </form>
      <div id="collab-list" style="margin-top: 15px; max-height: 180px; overflow-y: auto;"></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeCollabModal()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    /* INSIRA AQUI SUAS CHAVES DO SUPABASE SE ESTIVER USANDO */
    const SUPABASE_URL = ''; 
    const SUPABASE_KEY = '';
    
    let supabaseClient = null;
    if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let collaborators = [];
    let meetings = [];

    const hours = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('week-picker').value = today;
      document.getElementById('seat-search-date').value = today;
      loadData();
    });

    async function loadData() {
      if (supabaseClient) {
        const { data: cData } = await supabaseClient.from('collaborators').select('*');
        if (cData) collaborators = cData;
        const { data: mData } = await supabaseClient.from('meetings').select('*');
        if (mData) meetings = mData;
      }
      renderDashboard();
      renderSeats();
    }

    function switchTab(tab) {
      document.getElementById('btn-tab-coworking').classList.remove('active');
      document.getElementById('btn-tab-seats').classList.remove('active');
      document.getElementById('view-coworking').style.display = 'none';
      document.getElementById('view-seats').style.display = 'none';
      
      if (tab === 'coworking') {
        document.getElementById('view-coworking').style.display = 'block';
        document.getElementById('btn-tab-coworking').classList.add('active');
      } else {
        document.getElementById('view-seats').style.display = 'block';
        document.getElementById('btn-tab-seats').classList.add('active');
      }
    }

    /* RENDERIZAR TABELA SEMANAL */
    function renderDashboard() {
      const container = document.getElementById('weekly-table');
      const selectedDate = new Date(document.getElementById('week-picker').value || Date.now());
      
      // Encontrar a segunda-feira da semana selecionada
      const dayOfWeek = selectedDate.getDay();
      const diffToMonday = selectedDate.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
      const monday = new Date(selectedDate.setDate(diffToMonday));

      const weekDays = [];
      for (let i = 0; i < 5; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        weekDays.push(d);
      }

      let html = '<div class="grid-header">Hora</div>';
      const dayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'];
      weekDays.forEach((d, idx) => {
        const formattedDate = `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}`;
        html += `<div class="grid-header">${dayNames[idx]}<br><small>${formattedDate}</small></div>`;
      });

      hours.forEach(hour => {
        html += `<div class="time-slot">${hour}</div>`;
        weekDays.forEach(d => {
          const dateStr = d.toISOString().split('T')[0];
          const matches = meetings.filter(m => m.date === dateStr && m.start.startsWith(hour.substring(0, 2)));

          html += `<div class="day-cell">`;
          matches.forEach(m => {
            html += `
              <div class="event-card" onclick='openMeetingModal(${JSON.stringify(m)})'>
                <div class="event-title">${m.title}</div>
                <div class="event-time">${m.start} - ${m.end} (${m.owner})</div>
              </div>
            `;
          });
          html += `</div>`;
        });
      });

      container.innerHTML = html;
    }

    /* MODAIS E COLABORADORES */
    function openCollabModal() { renderCollabList(); document.getElementById('collab-modal').style.display = 'flex'; }
    function closeCollabModal() { document.getElementById('collab-modal').style.display = 'none'; }

    async function saveCollaborator(e) {
      e.preventDefault();
      const name = document.getElementById('c-name').value;
      const team = document.getElementById('c-team').value;

      if (supabaseClient) {
        const { data } = await supabaseClient.from('collaborators').insert([{ name, team }]).select();
        if (data) collaborators.push(data[0]);
      } else {
        collaborators.push({ id: Date.now().toString(), name, team });
      }
      document.getElementById('c-name').value = '';
      renderCollabList();
    }

    function renderCollabList() {
      const container = document.getElementById('collab-list');
      container.innerHTML = collaborators.map(c => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border-color);">
          <span style="font-size:0.85rem;">${c.name} <strong>(${c.team})</strong></span>
          <button class="btn" style="color:#ef4444; padding:2px 6px; font-size:0.75rem;" onclick="deleteCollaborator('${c.id}')">Excluir</button>
        </div>
      `).join('');
    }

    async function deleteCollaborator(id) {
      if (supabaseClient) await supabaseClient.from('collaborators').delete().eq('id', id);
      collaborators = collaborators.filter(c => c.id !== id);
      renderCollabList();
    }

    function openMeetingModal(meetingData) {
      const modal = document.getElementById('meeting-modal');
      const selectOwner = document.getElementById('m-owner-select');
      selectOwner.innerHTML = '';

      if (collaborators.length === 0) {
        selectOwner.innerHTML = '<option value="">Cadastre um colaborador antes</option>';
      } else {
        collaborators.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.innerText = `${c.name} (${c.team})`;
          selectOwner.appendChild(opt);
        });
      }

      if (meetingData && meetingData.id) {
        document.getElementById('modal-title-text').innerText = 'Editar Reunião';
        document.getElementById('m-id').value = meetingData.id;
        document.getElementById('m-title').value = meetingData.title;
        document.getElementById('m-owner-select').value = meetingData.owner;
        document.getElementById('m-attendees').value = meetingData.attendees_count || 1;
        document.getElementById('m-participants').value = meetingData.participants || '';
        document.getElementById('m-date').value = meetingData.date;
        document.getElementById('m-start').value = meetingData.start;
        document.getElementById('m-end').value = meetingData.end;
        document.getElementById('m-recurrence').value = meetingData.recurrence || 'none';
        document.getElementById('m-except-day').value = meetingData.exceptDay || 'none';
        document.getElementById('btn-delete-meeting').style.display = 'inline-block';
      } else {
        document.getElementById('modal-title-text').innerText = 'Agendar Reunião';
        document.getElementById('meeting-form').reset();
        document.getElementById('m-id').value = '';
        document.getElementById('m-attendees').value = 1;
        document.getElementById('btn-delete-meeting').style.display = 'none';
      }

      modal.style.display = 'flex';
    }

    function closeMeetingModal() { document.getElementById('meeting-modal').style.display = 'none'; }

    async function saveMeeting(e) {
      e.preventDefault();
      const id = document.getElementById('m-id').value;
      const ownerName = document.getElementById('m-owner-select').value;
      const collab = collaborators.find(c => c.name === ownerName);

      const meetingObj = {
        title: document.getElementById('m-title').value,
        owner: ownerName,
        team: collab ? collab.team : 'CEO',
        attendees_count: parseInt(document.getElementById('m-attendees').value) || 1,
        participants: document.getElementById('m-participants').value,
        date: document.getElementById('m-date').value,
        start: document.getElementById('m-start').value,
        end: document.getElementById('m-end').value,
        recurrence: document.getElementById('m-recurrence').value,
        exceptDay: document.getElementById('m-except-day').value
      };

      if (supabaseClient) {
        if (id) {
          await supabaseClient.from('meetings').update(meetingObj).eq('id', id);
          const idx = meetings.findIndex(m => m.id == id);
          if (idx !== -1) meetings[idx] = { ...meetings[idx], ...meetingObj };
        } else {
          const { data } = await supabaseClient.from('meetings').insert([meetingObj]).select();
          if (data) meetings.push(data[0]);
        }
      } else {
        if (id) {
          const idx = meetings.findIndex(m => m.id == id);
          if (idx !== -1) meetings[idx] = { ...meetingObj, id };
        } else {
          meetingObj.id = Date.now().toString();
          meetings.push(meetingObj);
        }
      }

      closeMeetingModal();
      renderDashboard();
    }

    async function deleteMeeting() {
      const id = document.getElementById('m-id').value;
      if (!id) return;
      if (supabaseClient) await supabaseClient.from('meetings').delete().eq('id', id);
      meetings = meetings.filter(m => m.id != id);
      closeMeetingModal();
      renderDashboard();
    }

    function renderSeats() {
      const m1 = document.getElementById('seats-m1');
      const m2 = document.getElementById('seats-m2');
      m1.innerHTML = '<div class="seat">C1 - Livre</div><div class="seat">C2 - Livre</div><div class="seat">C3 - Livre</div><div class="seat">C4 - Livre</div>';
      m2.innerHTML = '<div class="seat">C1 - Livre</div><div class="seat">C2 - Livre</div><div class="seat">C3 - Livre</div><div class="seat">C4 - Livre</div>';
    }
  </script>
</body>
</html>
