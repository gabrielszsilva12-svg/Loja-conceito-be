<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE | Agenda da Sala</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fa;
  color:#172033
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.header{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px
}

.status{
  padding:7px 12px;
  border-radius:20px;
  background:#dcfce7;
  color:#15803d;
  font-size:12px;
  font-weight:800
}

.status.offline{
  background:#fff7ed;
  color:#c2410c
}

.container{
  max-width:1500px;
  margin:auto;
  padding:24px
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap
}

.tabs{
  display:flex;
  gap:8px
}

.tab{
  border:0;
  background:#e9edf3;
  padding:10px 18px;
  border-radius:9px;
  font-weight:700
}

.tab.active{
  background:#172033;
  color:#fff
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.btn{
  border:1px solid #d7dce4;
  background:#fff;
  padding:9px 14px;
  border-radius:8px;
  font-weight:700
}

.btn:hover{background:#f1f5f9}

.btn-primary{
  background:#172033;
  color:#fff;
  border-color:#172033
}

.btn-danger{
  color:#dc2626;
  border-color:#fecaca
}

.week-controls{
  display:flex;
  align-items:center;
  gap:8px
}

.week-controls input,
.date-input{
  padding:9px 11px;
  border:1px solid #d7dce4;
  border-radius:8px;
  background:#fff
}

/* CALENDÁRIO */

.calendar-wrapper{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:14px;
  overflow:auto;
  box-shadow:0 3px 15px rgba(15,23,42,.04)
}

.calendar{
  min-width:950px;
  display:grid;
  grid-template-columns:75px repeat(5,1fr)
}

.grid-header{
  background:#f8fafc;
  border-right:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb;
  padding:12px;
  text-align:center;
  font-weight:800;
  min-height:55px
}

.grid-header small{
  font-weight:500;
  color:#64748b
}

.time-slot{
  min-height:82px;
  padding:12px 8px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#64748b;
  border-right:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb
}

.day-cell{
  min-height:82px;
  padding:5px;
  border-right:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb;
  background:#fff
}

.day-cell:hover{
  background:#fafafa
}

.event-card{
  background:#172033;
  color:#fff;
  border-radius:8px;
  padding:8px;
  margin-bottom:4px;
  cursor:pointer;
  font-size:11px
}

.event-card:hover{
  opacity:.88
}

.event-title{
  font-weight:800;
  margin-bottom:3px
}

.event-time{
  opacity:.8
}

.event-owner{
  margin-top:3px;
  font-size:10px;
  opacity:.75
}

/* ASSENTOS */

.seats-view{
  display:none
}

.seat-toolbar{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:20px
}

.room{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px rgba(15,23,42,.04)
}

.room h3{
  margin:0 0 18px
}

.table{
  background:#dbe3ec;
  border-radius:10px;
  padding:12px;
  margin-bottom:22px
}

.table-name{
  text-align:center;
  font-weight:800;
  font-size:12px;
  margin-bottom:8px
}

.seats-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0
}

.seat-chair{
  width:115px;
  min-height:55px;
  border:2px solid #cbd5e1;
  border-radius:8px;
  background:#f8fafc;
  padding:7px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:.15s
}

.seat-chair:hover{
  transform:translateY(-2px);
  border-color:#64748b
}

.seat-chair.occupied{
  background:#172033;
  color:#fff;
  border-color:#172033
}

.seat-status{
  font-size:10px;
  margin-top:3px;
  text-align:center;
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

/* MODAIS */

.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.2)
}

.modal-header{
  padding:20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.modal-header h2{
  margin:0;
  font-size:19px
}

.close{
  border:0;
  background:none;
  font-size:25px;
  color:#64748b
}

.modal-body{
  padding:20px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px
}

.form-group.full{
  grid-column:1/-1
}

.form-group label{
  font-size:12px;
  font-weight:800;
  color:#475569
}

.form-group input,
.form-group select,
.form-group textarea{
  border:1px solid #d7dce4;
  border-radius:8px;
  padding:10px;
  background:#fff
}

.form-group textarea{
  min-height:80px;
  resize:vertical
}

.modal-footer{
  padding:15px 20px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  gap:8px
}

.footer-right{
  display:flex;
  gap:8px
}

.empty-state{
  text-align:center;
  padding:30px;
  color:#64748b
}

@media(max-width:700px){
  .container{padding:12px}
  .header{padding:0 14px}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">BE</div>

  <div class="header-right">
    <span id="connection-status" class="status offline">
      ● Carregando...
    </span>
  </div>
</header>

<main class="container">

  <div class="toolbar">

    <div class="tabs">
      <button id="btn-tab-coworking"
              class="tab active"
              onclick="switchTab('coworking')">
        Agenda
      </button>

      <button id="btn-tab-seats"
              class="tab"
              onclick="switchTab('seats')">
        Mesas
      </button>
    </div>

    <div class="actions">

      <button class="btn"
              onclick="openCollabModal()">
        Colaboradores
      </button>

      <button class="btn btn-primary"
              onclick="openMeetingModal()">
        + Nova reunião
      </button>

    </div>
  </div>

  <!-- AGENDA -->

  <section id="view-coworking">

    <div class="toolbar">

      <div class="week-controls">

        <button class="btn"
                onclick="changeWeek(-1)">
          ←
        </button>

        <input id="week-picker"
               type="date"
               onchange="renderDashboard()">

        <button class="btn"
                onclick="changeWeek(1)">
          →
        </button>

      </div>

      <strong id="week-label"></strong>

    </div>

    <div class="calendar-wrapper">

      <div id="weekly-table"
           class="calendar">
      </div>

    </div>

  </section>

  <!-- MESAS -->

  <section id="view-seats"
           class="seats-view">

    <div class="seat-toolbar">

      <div>
        <strong>Mapa de mesas</strong>
        <div style="font-size:12px;color:#64748b">
          Clique em um assento para alocar ou editar.
        </div>
      </div>

      <input id="seat-search-date"
             class="date-input"
             type="date"
             onchange="renderSeats()">

    </div>

    <div class="rooms">

      <!-- SALA 1 -->

      <div class="room">

        <h3>Sala de Reunião 01</h3>

        <div class="table">

          <div class="table-name">
            MESA 01
          </div>

          <div id="m1-top"
               class="seats-row">
          </div>

          <div id="m1-bottom"
               class="seats-row">
          </div>

        </div>

      </div>

      <!-- SALA 2 -->

      <div class="room">

        <h3>Sala de Reunião 02</h3>

        <div class="table">

          <div class="table-name">
            MESA 02
          </div>

          <div id="m2-top"
               class="seats-row">
          </div>

          <div id="m2-bottom"
               class="seats-row">
          </div>

        </div>

      </div>

      <!-- MARKETING -->

      <div class="room">

        <h3>Mesa Marketing</h3>

        <div class="table">

          <div class="table-name">
            MARKETING
          </div>

          <div id="m3-top"
               class="seats-row">
          </div>

          <div id="m3-bottom"
               class="seats-row">
          </div>

        </div>

      </div>

    </div>

  </section>

</main>

<!-- MODAL REUNIÃO -->

<div id="meeting-modal"
     class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modal-title-text">
        Agendar Reunião
      </h2>

      <button class="close"
              onclick="closeMeetingModal()">
        ×
      </button>

    </div>

    <form id="meeting-form"
          onsubmit="saveMeeting(event)">

      <div class="modal-body">

        <input id="m-id"
               type="hidden">

        <div class="form-grid">

          <div class="form-group full">
            <label>Título da reunião</label>
            <input id="m-title"
                   required
                   placeholder="Ex.: Reunião Comercial">
          </div>

          <div class="form-group">
            <label>Responsável</label>

            <select id="m-owner-select"
                    required>
            </select>
          </div>

          <div class="form-group">
            <label>Nº de pessoas</label>

            <input id="m-attendees"
                   type="number"
                   min="1"
                   value="1">
          </div>

          <div class="form-group">
            <label>Data</label>

            <input id="m-date"
                   type="date"
                   required>
          </div>

          <div class="form-group">
            <label>Recorrência</label>

            <select id="m-recurrence">

              <option value="none">
                Sem recorrência
              </option>

              <option value="daily">
                Diária
              </option>

              <option value="weekly">
                Semanal
              </option>

              <option value="biweekly">
                Quinzenal
              </option>

              <option value="monthly">
                Mensal
              </option>

            </select>

          </div>

          <div class="form-group">
            <label>Início</label>

            <input id="m-start"
                   type="time"
                   required>
          </div>

          <div class="form-group">
            <label>Fim</label>

            <input id="m-end"
                   type="time"
                   required>
          </div>

          <div class="form-group full">
            <label>Participantes / observações</label>

            <textarea id="m-participants"
                      placeholder="Participantes, observações ou informações adicionais"></textarea>
          </div>

        </div>

      </div>

      <div class="modal-footer">

        <button type="button"
                id="btn-delete-meeting"
                class="btn btn-danger"
                style="display:none"
                onclick="deleteMeeting()">
          Excluir
        </button>

        <div class="footer-right">

          <button type="button"
                  class="btn"
                  onclick="closeMeetingModal()">
            Cancelar
          </button>

          <button type="submit"
                  class="btn btn-primary">
            Salvar
          </button>

        </div>

      </div>

    </form>

  </div>

</div>

<!-- MODAL ASSENTO -->

<div id="seat-modal"
     class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2 id="seat-modal-title">
        Alocar Assento
      </h2>

      <button class="close"
              onclick="closeSeatModal()">
        ×
      </button>

    </div>

    <form onsubmit="saveSeatAllocation(event)">

      <div class="modal-body">

        <input id="s-table-id"
               type="hidden">

        <input id="s-seat-code"
               type="hidden">

        <input id="s-existing-id"
               type="hidden">

        <div class="form-grid">

          <div class="form-group full">

            <label>Colaborador</label>

            <select id="s-collab-select"
                    required>
            </select>

          </div>

          <div class="form-group">

            <label>Data inicial</label>

            <input id="s-start-date"
                   type="date"
                   required>

          </div>

          <div class="form-group">

            <label>Recorrência</label>

            <select id="s-recurrence">

              <option value="single">
                Apenas este dia
              </option>

              <option value="daily">
                Todos os dias úteis
              </option>

              <option value="weekly">

              </option>

              <option value="biweekly">
                Quinzenal

            </select>

          </div>

          <div class="form-group full">

            <label>Dia de exceção</label>

            <select id="s-except-day">

              <option value="none">
                Sem exceção
              </option>

              <option value="1">
                Segunda-feira
              </option>

              <option value="2">
                Terça-feira
              </option>

              <option value="3">
                Quarta-feira
              </option>

              <option value="4">
                Quinta-feira
              </option>

              <option value="5">
                Sexta-feira
              </option>

            </select>

          </div>

        </div>

      </div>

      <div class="modal-footer">

        <button type="button"
                id="btn-remove-seat"
                class="btn btn-danger"
                style="display:none"
                onclick="removeSeatAllocation()">
          Remover
        </button>

        <div class="footer-right">

          <button type="button"
                  class="btn"
                  onclick="closeSeatModal()">
            Cancelar
          </button>

          <button type="submit"
                  class="btn btn-primary">
            Salvar
          </button>

        </div>

      </div>

    </form>

  </div>

</div>

<!-- MODAL COLABORADORES -->

<div id="collab-modal"
     class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2>Colaboradores</h2>

      <button class="close"
              onclick="closeCollabModal()">
        ×
      </button>

    </div>

    <div class="modal-body">

      <form onsubmit="saveCollaborator(event)">

        <div class="form-grid">

          <div class="form-group">

            <label>Nome</label>

            <input id="c-name"
                   required
                   placeholder="Nome do colaborador">

          </div>

          <div class="form-group">

            <label>Equipe</label>

            <input id="c-team"
                   placeholder="Ex.: Marketing">

          </div>

        </div>

        <br>

        <button class="btn btn-primary"
                type="submit">
          + Adicionar colaborador
        </button>

      </form>

      <hr style="border:0;border-top:1px solid #e5e7eb;margin:20px 0">

      <div id="collab-list"></div>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  'https://twrtjqqaaiyleefbhdlz.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_lP0I0ScAAxzrtd20Gk6QMw_ID2j8bBd';

let db = null;

let collaborators = [];
let meetings = [];
let seatAllocations = [];

let realtimeChannels = [];

const hours = [
  '08:00','09:00','10:00','11:00','12:00',
  '13:00','14:00','15:00','16:00','17:00','18:00'
];

const $ = id => document.getElementById(id);

const pad = n => String(n).padStart(2,'0');

function localDateString(date = new Date()) {

  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;

}

function dateFromInput(value) {

  return new Date(`${value}T00:00:00`);

}

function addDays(date,amount) {

  const d = new Date(date);

  d.setDate(d.getDate()+amount);

  return d;

}

function startOfWeek(date) {

  const d = new Date(date);

  const day = d.getDay();

  d.setDate(
    d.getDate() +
    (day === 0 ? -6 : 1-day)
  );

  d.setHours(0,0,0,0);

  return d;

}

function minutes(time) {

  const [h,m] =
    String(time || '')
      .slice(0,5)
      .split(':')
      .map(Number);

  return (h || 0)*60 + (m || 0);

}

function esc(value) {

  return String(value ?? '')
    .replace(/[&<>"']/g,char => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[char]));

}

function setStatus(text,connected) {

  const element =
    $('connection-status');

  if(!element) return;

  element.textContent = text;

  element.classList.toggle(
    'offline',
    !connected
  );

}


/* =========================
   INICIALIZAÇÃO
========================= */

document.addEventListener(
  'DOMContentLoaded',
  init
);

async function init(){

  const today =
    localDateString();

  $('week-picker').value =
    today;

  $('seat-search-date').value =
    today;

  /*
    IMPORTANTE:
    A interface é criada ANTES
    da tentativa de conexão.
  */

  renderDashboard();
  renderSeats();

  if(!window.supabase){

    setStatus(
      '● Modo local',
      false
    );

    return;

  }

  try{

    db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    setStatus(
      '● Conectando...',
      false
    );

    await Promise.race([

      loadData(),

      new Promise(
        (_,reject) =>
          setTimeout(
            () => reject(
              new Error(
                'Timeout de conexão'
              )
            ),
            7000
          )
      )

    ]);

    setStatus(
      '● Sincronizado',
      true
    );

    setupRealtime();

  }catch(error){

    console.error(error);

    setStatus(
      '● Sem conexão',
      false
    );

    /*
      A agenda continua funcionando
      visualmente mesmo sem banco.
    */

    renderDashboard();
    renderSeats();

  }

}


/* =========================
   SUPABASE
========================= */

async function loadData(){

  if(!db) return;

  const [
    collaboratorsResult,
    meetingsResult,
    seatsResult
  ] = await Promise.all([

    db
      .from('collaborators')
      .select('*')
      .order('name'),

    db
      .from('meetings')
      .select('*')
      .order('date')
      .order('start'),

    db
      .from('seat_allocations')
      .select('*')
      .order('startDate')

  ]);

  if(collaboratorsResult.error)
    throw collaboratorsResult.error;

  if(meetingsResult.error)
    throw meetingsResult.error;

  if(seatsResult.error)
    throw seatsResult.error;

  collaborators =
    collaboratorsResult.data || [];

  meetings =
    meetingsResult.data || [];

  seatAllocations =
    seatsResult.data || [];

  renderDashboard();
  renderSeats();

}

function setupRealtime(){

  if(
    !db ||
    realtimeChannels.length
  ) return;

  [
    'collaborators',
    'meetings',
    'seat_allocations'

  ].forEach(table => {

    const channel =
      db
        .channel(
          `be-${table}-${Date.now()}`
        )
        .on(
          'postgres_changes',
          {
            event:'*',
            schema:'public',
            table
          },
          async () => {

            try{

              await loadData();

              setStatus(
                '● Sincronizado',
                true
              );

            }catch(error){

              console.error(error);

              setStatus(
                '● Sem conexão',
                false
              );

            }

          }
        )
        .subscribe();

    realtimeChannels.push(channel);

  });

}


/* =========================
   ABAS
========================= */

function switchTab(tab){

  const coworking =
    tab === 'coworking';

  $('btn-tab-coworking')
    .classList.toggle(
      'active',
      coworking
    );

  $('btn-tab-seats')
    .classList.toggle(
      'active',
      !coworking
    );

  $('view-coworking')
    .style.display =
      coworking
      ? 'block'
      : 'none';

  $('view-seats')
    .style.display =
      coworking
      ? 'none'
      : 'block';

  if(coworking)
    renderDashboard();
  else
    renderSeats();

}


/* =========================
   CALENDÁRIO
========================= */

function changeWeek(amount){

  const input =
    $('week-picker');

  const date =
    dateFromInput(
      input.value ||
      localDateString()
    );

  date.setDate(
    date.getDate() +
    amount*7
  );

  input.value =
    localDateString(date);

  renderDashboard();

}

function meetingOccursOnDate(
  meeting,
  targetDate
){

  if(
    !meeting ||
    !meeting.date
  ) return false;

  const start =
    dateFromInput(
      meeting.date
    );

  const target =
    dateFromInput(
      targetDate
    );

  if(target < start)
    return false;

  switch(
    meeting.recurrence ||
    'none'
  ){

    case 'none':

      return (
        meeting.date ===
        targetDate
      );

    case 'daily':

      return (
        target.getDay() >= 1 &&
        target.getDay() <= 5
      );

    case 'weekly':

      return (
        target.getDay() ===
        start.getDay()
      );

    case 'biweekly':{

      const difference =
        Math.floor(
          (target-start) /
          86400000
        );

      return (
        difference >= 0 &&
        difference % 14 === 0
      );

    }

    case 'monthly':

      return (
        target.getDate() ===
        start.getDate()
      );

    default:

      return false;

  }

}

function renderDashboard(){

  const container =
    $('weekly-table');

  if(!container) return;

  const selected =
    $('week-picker').value ||
    localDateString();

  const monday =
    startOfWeek(
      dateFromInput(selected)
    );

  const days =
    Array.from(
      {length:5},
      (_,index) =>
        addDays(
          monday,
          index
        )
    );

  $('week-label').textContent =
    `${pad(days[0].getDate())}/${pad(days[0].getMonth()+1)}
     -
     ${pad(days[4].getDate())}/${pad(days[4].getMonth()+1)}`;

  let html =
    '<div class="grid-header">Hora</div>';

  const names =
    [
      'Seg',
      'Ter',
      'Qua',
      'Qui',
      'Sex'
    ];

  days.forEach(
    (day,index) => {

      html += `
        <div class="grid-header">

          ${names[index]}

          <br>

          <small>
            ${pad(day.getDate())}/${pad(day.getMonth()+1)}
          </small>

        </div>
      `;

    }
  );

  hours.forEach(hour => {

    html += `
      <div class="time-slot">
        ${hour}
      </div>
    `;

    days.forEach(day => {

      const target =
        localDateString(day);

      const events =
        meetings
          .filter(
            meeting =>
              meetingOccursOnDate(
                meeting,
                target
              )
          )
          .filter(
            meeting =>
              String(
                meeting.start || ''
              ).slice(0,5) === hour
          )
          .sort(
            (a,b) =>
              String(a.start)
                .localeCompare(
                  String(b.start)
                )
          );

      html += `
        <div
          class="day-cell"
          onclick="handleSlotClick(
            '${target}',
            '${hour}'
          )"
        >
      `;

      events.forEach(meeting => {

        const encoded =
          encodeURIComponent(
            JSON.stringify(meeting)
          );

        html += `
          <div
            class="event-card"
            onclick="
              event.stopPropagation();
              openMeetingModalFromEncoded(
                '${encoded}'
              )
            "
          >

            <div class="event-title">
              ${esc(meeting.title)}
            </div>

            <div class="event-time">
              ${esc(
                String(
                  meeting.start || ''
                ).slice(0,5)
              )}
              -
              ${esc(
                String(
                  meeting.end || ''
                ).slice(0,5)
              )}
            </div>

            <div class="event-owner">
              ${esc(meeting.owner || '')}
            </div>

          </div>
        `;

      });

      html += `
        </div>
      `;

    });

  });

  container.innerHTML =
    html;

}

function handleSlotClick(
  date,
  hour
){

  const next =
    parseInt(
      hour.slice(0,2),
      10
    ) + 1;

  if(next > 19)
    return;

  openMeetingModal({

    date,

    start:hour,

    end:
      `${pad(next)}:00`

  });

}

function meetingConflict(
  candidate,
  editingId = ''
){

  const start =
    minutes(
      candidate.start
    );

  const end =
    minutes(
      candidate.end
    );

  if(end <= start){

    return (
      'O horário final deve ser maior ' +
      'que o horário inicial.'
    );

  }

  /*
    Verifica 1 ano para frente.
    Assim uma recorrência não consegue
    colidir com outra recorrência.
  */

  const base =
    dateFromInput(
      candidate.date
    );

  for(
    let i=0;
    i<366;
    i++
  ){

    const day =
      localDateString(
        addDays(base,i)
      );

    if(
      !meetingOccursOnDate(
        candidate,
        day
      )
    ) continue;

    for(
      const existing of meetings
    ){

      if(
        editingId &&
        String(existing.id) ===
        String(editingId)
      )
        continue;

      if(
        !meetingOccursOnDate(
          existing,
          day
        )
      )
        continue;

      if(
        start <
        minutes(existing.end) &&

        end >
        minutes(existing.start)
      ){

        return `
          Conflito com "${existing.title}"
          em
          ${day.split('-').reverse().join('/')}
          (
          ${String(existing.start).slice(0,5)}
          -
          ${String(existing.end).slice(0,5)}
          ).
        `;

      }

    }

  }

  return null;

}

async function saveMeeting(event){

  event.preventDefault();

  if(!db){

    alert(
      'O Supabase está indisponível. ' +
      'A agenda continua visível, mas a reunião ' +
      'não pode ser salva neste momento.'
    );

    return;

  }

  const id =
    $('m-id').value;

  const owner =
    $('m-owner-select').value;

  const collaborator =
    collaborators.find(
      c => c.name === owner
    );

  const data = {

    title:
      $('m-title').value.trim(),

    owner,

    team:
      collaborator?.team || '',

    attendees_count:
      parseInt(
        $('m-attendees').value,
        10
      ) || 1,

    participants:
      $('m-participants').value.trim(),

    date:
      $('m-date').value,

    start:
      $('m-start').value,

    end:
      $('m-end').value,

    recurrence:
      $('m-recurrence').value

  };

  if(
    !data.title ||
    !data.owner ||
    !data.date ||
    !data.start ||
    !data.end
  ){

    alert(
      'Preencha todos os campos obrigatórios.'
    );

    return;

  }

  const conflict =
    meetingConflict(
      data,
      id
    );

  if(conflict){

    alert(conflict);

    return;

  }

  try{

    let response;

    if(id){

      response =
        await db
          .from('meetings')
          .update(data)
          .eq('id',id)
          .select()
          .single();

    }else{

      response =
        await db
          .from('meetings')
          .insert([data])
          .select()
          .single();

    }

    if(response.error)
      throw response.error;

    closeMeetingModal();

    await loadData();

    setStatus(
      '● Sincronizado',
      true
    );

  }catch(error){

    console.error(error);

    setStatus(
      '● Sem conexão',
      false
    );

    alert(
      'Erro ao salvar reunião: ' +
      error.message
    );

  }

}

function seatOccursOnDate(
  allocation,
  targetDate
){

  const start =
    dateFromInput(
      allocation.startDate
    );

  const target =
    dateFromInput(
      targetDate
    );

  if(target < start)
    return false;

  const day =
    target.getDay();

  if(
    allocation.exceptDay &&
    allocation.exceptDay !== 'none' &&
    Number(
      allocation.exceptDay
    ) === day
  ){

    return false;

  }

  switch(
    allocation.recurrence ||
    'daily'
  ){

    case 'single':

      return (
        allocation.startDate ===
        targetDate
      );

    case 'daily':

      return (
        day >= 1 &&
        day <= 5
      );

    case 'weekly':

      return (
        day === start.getDay()
      );

    case 'biweekly':{

      const difference =
        Math.floor(
          (target-start) /
          86400000
        );

      return (
        difference >= 0 &&
        difference % 14 === 0
      );

    }

    default:

      return false;

  }

}

function getSeatOccupant(
  table,
  seat,
  date
){

  return seatAllocations
    .filter(
      allocation =>

        String(
          allocation.tableId
        ) === String(table) &&

        String(
          allocation.seatCode
        ) === String(seat) &&

        seatOccursOnDate(
          allocation,
          date
        )

    )
    .sort(
      (a,b) =>
        String(
          b.startDate
        ).localeCompare(
          String(
            a.startDate
          )
        )
    )[0] || null;

}

function seatConflict(
  candidate,
  editingId = ''
){

  const base =
    dateFromInput(
      candidate.startDate
    );

  for(
    let i=0;
    i<366;
    i++
  ){

    const day =
      localDateString(
        addDays(base,i)
      );

    if(
      !seatOccursOnDate(
        candidate,
        day
      )
    )
      continue;

    for(
      const existing of
      seatAllocations
    ){

      if(
        editingId &&
        String(existing.id) ===
        String(editingId)
      )
        continue;

      if(
        String(existing.tableId) !==
        String(candidate.tableId)
      )
        continue;

      if(
        String(existing.seatCode) !==
        String(candidate.seatCode)
      )
        continue;

      if(
        seatOccursOnDate(
          existing,
          day
        )
      ){

        return true;

      }

    }

  }

  return false;

}

  if(!db){

          .select()
          .single();

async function saveCollaborator(event){

  event.preventDefault();

  if(!db){

    alert(
      'Supabase indisponível.'
    );

    return;

  }

  const name =
    $('c-name')
      .value
      .trim();

  const team =
    $('c-team')
      .value
      .trim();

  if(!name)
    return;

  if(
    collaborators.some(
      c =>
        String(c.name)
          .toLowerCase() ===
        name.toLowerCase()
    )
  ){

    alert(
      'Este colaborador já está cadastrado.'
    );

    return;

  }

  try{

    const {error} =
      await db
        .from('collaborators')
        .insert([
          {
            name,
            team
          }
        ]);

    if(error)
      throw error;

    $('c-name').value =
      '';

    $('c-team').value =
      '';

    await loadData();

    renderCollabList();

  }catch(error){

    alert(
      'Erro ao cadastrar colaborador: ' +
      error.message
    );

  }

}

async function deleteCollaborator(id){

  const collaborator =
    collaborators.find(
      c =>
        String(c.id) ===
        String(id)
    );

  if(!collaborator)
    return;

  const hasMeeting =
    meetings.some(
      meeting =>
        meeting.owner ===
        collaborator.name
    );

  const hasSeat =
    seatAllocations.some(
      seat =>
        seat.collabName ===
        collaborator.name
    );

  if(hasMeeting || hasSeat){

    alert(
      'Este colaborador possui reuniões ou assentos vinculados. ' +
      'Remova os vínculos antes de excluir.'
    );

    return;

  }

  if(
    !confirm(
      `Excluir ${collaborator.name}?`
    )
  )
    return;

  if(!db)
    return;

  try{

    const {error} =
      await db
        .from('collaborators')
        .delete()
        .eq('id',id);

    if(error)
      throw error;

    await loadData();

    renderCollabList();

  }catch(error){

    alert(
      'Erro ao excluir colaborador: ' +
      error.message
    );

  }

}
