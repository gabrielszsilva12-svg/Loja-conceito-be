<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Espaços e Reuniões</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Seu conteúdo HTML da página aqui -->

  <script>
    // Configurações do Supabase obtidas do seu painel
    const SUPABASE_URL = 'https://twrtjqqaaiyleefbhdlz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LP0IScAAxzrtd20Gk6QMw_ID2j8';

    // Inicialização do cliente Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Exemplo de integração e funções de sincronização
    async function carregarColaboradores() {
      const { data, error } = await supabase
        .from('collaborators')
        .select('*');
      
      if (error) {
        console.error('Erro ao buscar colaboradores:', error);
        return;
      }
      console.log('Colaboradores carregados:', data);
    }

    async function carregarReunioes() {
      const { data, error } = await supabase
        .from('meetings')
        .select('*');
      
      if (error) {
        console.error('Erro ao buscar reuniões:', error);
        return;
      }
      console.log('Reuniões carregadas:', data);
    }

    async function carregarAlocacaoAssentos() {
      const { data, error } = await supabase
        .from('seat_allocations')
        .select('*');
      
      if (error) {
        console.error('Erro ao buscar alocação de assentos:', error);
        return;
      }
      console.log('Alocações de assentos carregadas:', data);
    }

    // Chamadas iniciais ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      carregarColaboradores();
      carregarReunioes();
      carregarAlocacaoAssentos();
    });
  </script>
</body>
</html>
