<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CONCEITO BE | Coworking Pro BE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:N27,Inter,Arial,sans-serif;
  background:#f5f7fa;
  color:#000000
}
button,input,select,textarea{font:inherit;font-family:N27,Inter,Arial,sans-serif}
button{cursor:pointer}

.header{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px
}

.status{
  padding:7px 12px;
  border-radius:20px;
  background:#dcfce7;
  color:#15803d;
  font-size:12px;
  font-weight:800
}

.status.offline{
  background:#fff7ed;
  color:#c2410c
}

.container{
  max-width:1500px;
  margin:auto;
  padding:24px
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap
}

.tabs{
  display:flex;
  gap:8px
}

.tab{
  border:0;
  background:#e9edf3;
  padding:10px 18px;
  border-radius:9px;
  font-weight:700
}

.tab.active{
  background:#000000;
  color:#fff
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.btn{
  border:1px solid #d7dce4;
  background:#fff;
  padding:9px 14px;
  border-radius:8px;
  font-weight:700
}

.btn:hover{background:#f1f5f9}

.btn-primary{
  background:#000000;
  color:#fff;
  border-color:#000000
}

.btn-danger{
  color:#dc2626;
  border-color:#fecaca
}

.week-controls{
  display:flex;
  align-items:center;
  gap:8px
}

.week-controls input,
.date-input{
  padding:9px 11px;
  border:1px solid #d7dce4;
  border-radius:8px;
  background:#fff
}

/* CALENDÁRIO */

.calendar-wrapper{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:14px;
  overflow:auto;
  box-shadow:0 3px 15px rgba(15,23,42,.04)
}

.calendar{
  min-width:950px;
  display:grid;
  grid-template-columns:75px repeat(7,1fr)
}

.grid-header{
  background:#f8fafc;
  border-right:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb;
  padding:12px;
  text-align:center;
  font-weight:800;
  min-height:55px
}

.grid-header small{
  font-weight:500;
  color:#64748b
}

.time-slot{
  min-height:var(--slot-height,82px);
  height:var(--slot-height,82px);
  padding:12px 8px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#64748b;
  border-right:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb
}

.day-cell{
  min-height:var(--slot-height,82px);
  height:var(--slot-height,82px);
  padding:5px;
  border-right:1px solid #e5e7eb;
  border-bottom:1px solid #e5e7eb;
  background:#fff;
  position:relative;
  overflow:visible;
}

.day-cell:hover{
  background:#fafafa
}

.event-card{
  background:#000000;
  color:#fff;
  border-radius:8px;
  padding:8px;
  margin-bottom:4px;
  cursor:pointer;
  font-size:12px;
  white-space:normal;
}

.event-card:hover{
  opacity:.88
}

.event-title{
  font-weight:800;
  font-size:13px;
  margin-bottom:3px;
  line-height:1.2;
}

.event-time{
  opacity:.8;
  font-size:11px;
}

.event-owner{
  margin-top:3px;
  font-size:11px;
  opacity:.75;
}

/* ASSENTOS */

.seats-view{
  display:none
}

.seat-toolbar{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:20px
}

.room{
  background:#fff;
  border:1px solid #e1e5eb;
  border-radius:14px;
  padding:20px;
  box-shadow:0 3px 15px rgba(15,23,42,.04)
}

.room h3{
  margin:0 0 18px
}

.table{
  background:#dbe3ec;
  border-radius:10px;
  padding:12px;
  margin-bottom:22px
}

.table-name{
  text-align:center;
  font-weight:800;
  font-size:12px;
  margin-bottom:8px
}

.seats-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:8px 0
}

.seat-chair{
  width:115px;
  min-height:55px;
  border:2px solid #cbd5e1;
  border-radius:8px;
  background:#f8fafc;
  padding:7px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:.15s
}

.seat-chair:hover{
  transform:translateY(-2px);
  border-color:#64748b
}

.seat-chair.occupied{
  background:#000000;
  color:#fff;
  border-color:#000000
}

.seat-status{
  font-size:10px;
  margin-top:3px;
  text-align:center;
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

/* MODAIS */

.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px
}

.modal{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.2)
}

.modal-header{
  padding:20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.modal-header h2{
  margin:0;
  font-size:19px
}

.close{
  border:0;
  background:none;
  font-size:25px;
  color:#64748b
}

.modal-body{
  padding:20px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px
}

.form-group.full{
  grid-column:1/-1
}

.form-group label{
  font-size:12px;
  font-weight:800;
  color:#475569
}

.form-group input,
.form-group select,
.form-group textarea{
  border:1px solid #d7dce4;
  border-radius:8px;
  padding:10px;
  background:#fff
}

.form-group textarea{
  min-height:80px;
  resize:vertical
}

.modal-footer{
  padding:15px 20px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  gap:8px
}

.footer-right{
  display:flex;
  gap:8px
}

.empty-state{
  text-align:center;
  padding:30px;
  color:#64748b
}

.brand-area{display:flex;align-items:center;gap:12px}
.logo-upload{width:42px;height:42px;border:1.5px dashed #94a3b8;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#f8fafc;flex:none}
.logo-upload input{display:none}
.logo-upload img{width:100%;height:100%;object-fit:contain}
.logo-upload span{font-size:24px;color:#64748b;font-weight:500}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}
.daily-calendar{min-width:650px;display:grid;grid-template-columns:75px 1fr}
.daily-calendar .day-cell{min-height:82px}
@media(max-width:700px){.brand-area{gap:8px}.logo{font-size:18px}.logo-upload{width:36px;height:36px}}

@media(max-width:700px){
  .container{padding:12px}
  .header{padding:0 14px}
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
}

.room-layout{
  min-height:255px;
  padding:12px 6px;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:78px 92px 78px;
  align-items:center;
  justify-items:center;
  gap:0;
}
.room-table-shape{
  grid-column:1;
  grid-row:2;
  position:static;
  transform:none;
  width:150px;
  height:88px;
  border:2px solid #000;
  border-radius:6px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:12px;
  font-weight:900;
  z-index:1;
}
.room-table-shape span{color:#000}
.marketing-table{width:175px}
.seats-row{
  position:relative;
  z-index:3;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  width:100%;
}
.room-layout > .seats-row:nth-of-type(2){grid-column:1;grid-row:1}
.room-layout > .seats-row:nth-of-type(3){grid-column:1;grid-row:3}

@media(min-width:900px){
  :root{--slot-height:60px}
  .header{height:62px}
  .container{padding:12px 24px}
  .toolbar{margin-bottom:10px}
  .calendar-wrapper{max-height:calc(100vh - 145px)}
  .grid-header{min-height:36px;padding:5px}
  .time-slot,.day-cell{min-height:var(--slot-height);height:var(--slot-height)}
  .time-slot{padding:5px}
  .day-cell{padding:3px}
  .event-card{padding:6px;font-size:11px}
  .event-title{font-size:12px}
  .event-owner{font-size:10px}
}

:root{--slot-height:82px}
.event-card{
  position:absolute;
  left:4px;
  right:4px;
  margin:0;
  top:4px;
  min-height:28px;
  height:calc(var(--event-duration-hours, 1) * var(--slot-height) - 8px);
  z-index:20;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.shift-panel{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:10px;
  margin-top:12px;
  background:#fafafa;
}
.shift-title{
  text-align:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
  margin-bottom:4px;
}
.shift-layout{
  min-height:210px;
  grid-template-rows:64px 82px 64px;
}
.shift-layout .seat-chair{
  width:105px;
  min-height:50px;
  font-size:11px;
}
.shift-layout .seat-status{font-size:9px}
@media(max-width:700px){.shift-layout .seat-chair{width:90px}}

</style>
</head>

<body>

<header class="header">
  <div class="brand-area">
    <label class="logo-upload" title="Adicionar logo">
      <input id="logo-input" type="file" accept="image/*" onchange="handleLogoUpload(event)">
      <img id="brand-logo" alt="Logo" style="display:none">
      <span id="logo-placeholder">+</span>
    </label>
    <div class="logo">LOJA CONCEITO BE</div>
  </div>

  <div class="header-right">
    <span id="connection-status" class="status offline">
      ● Carregando...
    </span>
  </div>
</header>

<main class="container">

  <div class="toolbar">

    <div class="tabs">
      <button id="btn-tab-coworking" class="tab active" onclick="switchTab('coworking')">Coworking Pro BE</button>
      <button id="btn-tab-seats" class="tab" onclick="switchTab('seats')">Mapeamento de lugares</button>
    </div>

    <div class="actions">
      <button class="btn" onclick="openCollabModal()">Colaboradores</button>
      <button class="btn" onclick="toggleAgendaView()" id="view-toggle-btn">Visualização: Semanal</button>
      <button class="btn" onclick="exportAgendaPNG()">Exportar PNG</button>
      <button class="btn btn-primary" onclick="openMeetingModal()">+ Nova reunião</button>
    </div>
  </div>

  <!-- AGENDA -->
  <section id="view-coworking">
    <div class="toolbar">
      <div class="week-controls">
        <button class="btn" onclick="changePeriod(-1)">←</button>
        <input id="week-picker" type="date" onchange="renderDashboard()">
        <button class="btn" onclick="changePeriod(1)">→</button>
      </div>
      <strong id="week-label"></strong>
    </div>

    <div class="calendar-wrapper">
      <div id="weekly-table" class="calendar agenda-export-area"></div>
    </div>
  </section>

  <!-- MESAS -->
  <section id="view-seats" class="seats-view">
    <div class="seat-toolbar">
      <div>
        <strong>Mapa de mesas</strong>
        <div style="font-size:12px;color:#64748b">Clique em um assento para alocar ou editar.</div>
      </div>

      <div class="tabs" style="margin: 0 auto;">
         <button id="btn-shift-morning" class="tab active" onclick="toggleSeatShift('morning')">Manhã</button>
         <button id="btn-shift-afternoon" class="tab" onclick="toggleSeatShift('afternoon')">Tarde</button>
      </div>

      <input id="seat-search-date" class="date-input" type="date" onchange="renderSeats()">
    </div>

    <div class="rooms">
      <div class="room">
        <h3>Meeting 01</h3>
        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 01</span></div>
            <div id="m1-morning-top" class="seats-row"></div>
            <div id="m1-morning-bottom" class="seats-row"></div>
          </div>
        </div>
        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 01</span></div>
            <div id="m1-afternoon-top" class="seats-row"></div>
            <div id="m1-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

      <div class="room">
        <h3>Meeting 02</h3>
        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 02</span></div>
            <div id="m2-morning-top" class="seats-row"></div>
            <div id="m2-morning-bottom" class="seats-row"></div>
          </div>
        </div>
        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 02</span></div>
            <div id="m2-afternoon-top" class="seats-row"></div>
            <div id="m2-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

      <div class="room">
        <h3>Mesa Marketing</h3>
        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape marketing-table"><span>MARKETING</span></div>
            <div id="m3-morning-top" class="seats-row"></div>
            <div id="m3-morning-bottom" class="seats-row"></div>
          </div>
        </div>
        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape marketing-table"><span>MARKETING</span></div>
            <div id="m3-afternoon-top" class="seats-row"></div>
            <div id="m3-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- MODAL REUNIÃO -->
<div id="meeting-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title-text">Agendar Reunião</h2>
      <button class="close" onclick="closeMeetingModal()">×</button>
    </div>

    <form id="meeting-form" onsubmit="saveMeeting(event)">
      <div class="modal-body">
        <input id="m-id" type="hidden">

        <div class="form-grid">
          <div class="form-group full" style="display:flex; gap:14px; flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:120px;">
               <label>Time Responsável</label>
               <select id="m-team-select"></select>
            </div>
            <div class="form-group" style="flex:3; min-width:200px;">
               <label>Título da reunião</label>
               <input id="m-title" required placeholder="Ex.: Sprint Comercial">
            </div>
          </div>

          <div class="form-group">
            <label>Tipo de Reunião</label>
