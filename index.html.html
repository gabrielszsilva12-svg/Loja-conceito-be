<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CONCEITO BE | Coworking Pro BE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* APLICAÇÃO GLOBAL DA FONTE N27 */
* { 
  box-sizing: border-box; 
  font-family: 'N27', Inter, Arial, sans-serif !important; 
}

:root{
  --bg:#f7f7f6;
  --surface:#ffffff;
  --surface-soft:#fafafa;
  --line:#e8e8e6;
  --line-strong:#dededb;
  --text:#111111;
  --muted:#737373;
  --black:#111111;
  --hover:#f3f3f1;
  --radius:12px;
}

/* FIXAR TELA SEM SCROLL */
html, body {
  margin: 0;
  padding: 0;
  height: 100vh; /* Ocupa 100% da tela */
  width: 100vw;
  overflow: hidden; /* Remove barra de rolagem principal */
  background: var(--bg);
  color: var(--text);
  letter-spacing: -.01em;
  display: flex;
  flex-direction: column;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.header {
  flex-shrink: 0;
  height: 68px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  z-index: 20;
}

.logo { font-size: 25px; font-weight: 900; letter-spacing: -1px; }
.header-right { display: flex; align-items: center; gap: 12px; }

/* Botão de alternância ADM */
.admin-toggle {
  display: flex; align-items: center; gap: 8px; font-size: 11px; 
  font-weight: 800; background: #f3f4f6; padding: 6px 12px; 
  border-radius: 20px; cursor: pointer; border: 1px solid #d1d5db;
}
.admin-toggle input { cursor: pointer; }

.status { padding: 7px 12px; border-radius: 20px; background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 800; }
.status.offline { background: #fff7ed; color: #c2410c; }

/* CONTAINER PRINCIPAL ADAPTÁVEL */
.container {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 1500px;
  width: 100%;
  margin: auto;
  padding: 10px 24px 16px 24px;
  overflow: hidden; /* Sem rolagem extra aqui */
}

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 12px; flex-wrap: wrap; flex-shrink: 0; }
.tabs { display: flex; gap: 6px; }
.tab { border: 0; background: #eeeeec; padding: 9px 16px; border-radius: 10px; font-weight: 700; transition: all .2s; }
.tab.active { background: #111; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.tab:not(.active):hover { background: #e8e8e5; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line-strong); background: #fff; padding: 9px 14px; border-radius: 10px; font-weight: 700; transition: all .18s ease; }
.btn:hover { background: #f3f3f1; border-color: #d4d4d1; transform: translateY(-1px); }
.btn-primary { background: #111; color: #fff; border-color: #000000; }
.btn-primary:hover { background: #333; }
.btn-danger { color: #dc2626; border-color: #fecaca; }

.week-controls { display: flex; align-items: center; gap: 8px; }
.week-controls input, .date-input { padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }

/* VISUALIZAÇÕES */
#view-coworking, #view-seats { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* CALENDÁRIO OTIMIZADO PARA 100VH */
.calendar-wrapper {
  flex: 1;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden; /* Oculta barras laterais - Tudo cabe na tela */
  display: flex;
  flex-direction: column;
}

.calendar, .daily-calendar {
  display: grid;
  flex: 1;
  height: 100%;
  /* 1 linha de cabeçalho (45px) + 11 linhas flexíveis (frações perfeitamente iguais) */
  grid-template-rows: 45px repeat(11, minmax(0, 1fr)); 
}
.calendar { grid-template-columns: 75px repeat(7, minmax(0, 1fr)); }
.daily-calendar { grid-template-columns: 75px minmax(0, 1fr); }

.grid-header {
  background: #fbfbfa; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; line-height: 1.1;
}
.grid-header small { font-weight: 500; color: #777; font-size: 10px; margin-top: 3px; }

.time-slot {
  display: flex; align-items: flex-start; justify-content: center;
  padding: 4px; text-align: center; font-size: 11px; font-weight: 700; color: #777;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
}

.day-cell {
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: #fff; position: relative; cursor: cell;
}
.day-cell:hover { background: #fbfbfa; }

/* CARDS DE REUNIÃO (FONTE MENOR E PONTAS ARREDONDADAS) */
.event-card {
  position: absolute;
  left: 4px; right: 4px;
  background: #111; color: #fff;
  border-radius: 8px; /* Pontas arredondadas */
  padding: 4px 6px; /* Ajuste para caber informações curtas */
  cursor: pointer;
  z-index: 10;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
  transition: transform .15s ease, z-index .15s ease;
  display: flex; flex-direction: column; gap: 2px;
}
.event-card:hover { transform: translateY(-1px) scale(1.02); z-index: 20; }

/* Card de Status Pendente */
.event-card.pending-event { background: #fef08a !important; color: #854d0e !important; border: 1px dashed #ca8a04; }

.event-title { font-weight: 900; font-size: 11px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-time { font-size: 9px; opacity: 0.9; }
.event-owner { font-size: 9px; opacity: 0.8; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ASSENTOS (COM ROLAGEM SÓ SE NECESSÁRIO) */
#view-seats { overflow-y: auto; padding-right: 4px; }
.seats-view { display: none; }
.seat-toolbar { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
.rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 15px; }
.room { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 15px; box-shadow: 0 2px 12px rgba(0,0,0,.035); }
.room h3 { margin: 0 0 12px; font-size: 15px; }

.shift-panel { border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; margin-top: 10px; background: #fbfbfa; }
.shift-title { text-align: center; font-size: 11px; font-weight: 900; letter-spacing: .8px; margin-bottom: 4px; }
.room-layout { display: grid; grid-template-columns: 1fr; grid-template-rows: 64px 82px 64px; align-items: center; justify-items: center; gap: 0; min-height: 200px;}
.room-table-shape { grid-column: 1; grid-row: 2; width: 140px; height: 75px; border: 2px solid #000; border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; z-index: 1; }
.marketing-table { width: 160px; }
.seats-row { position: relative; z-index: 3; display: flex; justify-content: center; gap: 8px; width: 100%; }
.room-layout > .seats-row:nth-of-type(2){grid-column:1;grid-row:1}
.room-layout > .seats-row:nth-of-type(3){grid-column:1;grid-row:3}

.seat-chair { width: 100px; min-height: 48px; border: 1.5px solid #d7d7d4; border-radius: 10px; background: #fbfbfa; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: .15s; font-size: 11px; font-weight: 700; padding: 4px; }
.seat-chair:hover { transform: translateY(-2px); border-color: #777; }
.seat-chair.occupied { background: #111; color: #fff; border-color: #000; }
.seat-status { font-size: 9px; margin-top: 2px; text-align: center; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

/* MODAIS */
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal { background: #fff; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,.2); display: flex; flex-direction: column; }
.modal-header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.modal-header h2 { margin: 0; font-size: 19px; }
.close { border: 0; background: none; font-size: 25px; color: #777; }
.modal-body { padding: 20px; flex: 1; overflow-y: auto; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 12px; font-weight: 800; color: #475569; }
.form-group input, .form-group select, .form-group textarea { border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px; background: #fff; }
.form-group textarea { min-height: 80px; resize: vertical; }
.modal-footer { padding: 15px 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; gap: 8px; flex-shrink: 0; }
.footer-right { display: flex; gap: 8px; }

/* SELEÇÃO DE HORÁRIOS EM CHIPS (MAIS DINÂMICO) */
.chip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
  gap: 8px;
  margin-top: 4px;
}
.time-chip {
  padding: 8px 4px; text-align: center; border: 1px solid var(--line-strong);
  border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;
  background: #fbfbfa; color: #777; transition: all 0.2s;
}
.time-chip:hover { background: #e8e8e6; color: #111; border-color: #aaa; }
.time-chip.active { background: #111; color: #fff; border-color: #111; }

.brand-area { display: flex; align-items: center; gap: 12px; }
.logo-upload { width: 42px; height: 42px; border: 1.5px dashed #94a3b8; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; background: #fbfbfa; flex: none; }
.logo-upload input { display: none; }
.logo-upload img { width: 100%; height: 100%; object-fit: contain; }
.logo-upload span { font-size: 24px; color: #777; font-weight: 500; }

@media(max-width:700px){
  .form-grid{grid-template-columns:1fr}
  .form-group.full{grid-column:auto}
  .calendar-wrapper { overflow: auto; } /* Ativa rolagem só em celulares pequenos */
}
</style>
</head>
<body>

<header class="header">
  <div class="brand-area">
    <label class="logo-upload" title="Adicionar logo">
      <input id="logo-input" type="file" accept="image/*" onchange="handleLogoUpload(event)">
      <img id="brand-logo" alt="Logo" style="display:none">
      <span id="logo-placeholder">+</span>
    </label>
    <div class="logo">LOJA CONCEITO BE</div>
  </div>

  <div class="header-right">
    <label class="admin-toggle">
      <input type="checkbox" id="admin-mode-toggle" onchange="toggleAdminMode()">
      MODO ADM
    </label>
    <span id="connection-status" class="status offline">● Carregando...</span>
  </div>
</header>

<main class="container">

  <div class="toolbar">
    <div class="tabs">
      <button id="btn-tab-coworking" class="tab active" onclick="switchTab('coworking')">Coworking Pro BE</button>
      <button id="btn-tab-seats" class="tab" onclick="switchTab('seats')">Mapeamento de lugares</button>
    </div>

    <div class="actions">
      <button class="btn" onclick="openCollabModal()">Colaboradores</button>
      <button class="btn" onclick="toggleAgendaView()" id="view-toggle-btn">Visualização: Semanal</button>
      <button class="btn" onclick="exportAgendaPNG()">Exportar PNG</button>
      <button class="btn btn-primary" onclick="openMeetingModal()">+ Nova reunião</button>
    </div>
  </div>

  <!-- AGENDA -->
  <section id="view-coworking">
    <div class="toolbar" style="margin-bottom: 8px;">
      <div class="week-controls">
        <button class="btn" onclick="changePeriod(-1)">←</button>
        <input id="week-picker" type="date" onchange="renderDashboard()">
        <button class="btn" onclick="changePeriod(1)">→</button>
      </div>
      <strong id="week-label" style="font-size: 14px;"></strong>
    </div>

    <div class="calendar-wrapper">
      <div id="weekly-table" class="calendar agenda-export-area"></div>
    </div>
  </section>

  <!-- MESAS -->
  <section id="view-seats" class="seats-view">
    <div class="seat-toolbar">
      <div>
        <strong>Mapa de mesas</strong>
        <div style="font-size:12px;color:#777">Clique em um assento para alocar ou editar.</div>
      </div>
      <div class="tabs" style="margin: 0 auto;">
         <button id="btn-shift-morning" class="tab active" onclick="toggleSeatShift('morning')">Manhã</button>
         <button id="btn-shift-afternoon" class="tab" onclick="toggleSeatShift('afternoon')">Tarde</button>
      </div>
      <input id="seat-search-date" class="date-input" type="date" onchange="renderSeats()">
    </div>

    <div class="rooms">
      <div class="room">
        <h3>Meeting 01</h3>
        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 01</span></div>
            <div id="m1-morning-top" class="seats-row"></div>
            <div id="m1-morning-bottom" class="seats-row"></div>
          </div>
        </div>
        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 01</span></div>
            <div id="m1-afternoon-top" class="seats-row"></div>
            <div id="m1-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

      <div class="room">
        <h3>Meeting 02</h3>
        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 02</span></div>
            <div id="m2-morning-top" class="seats-row"></div>
            <div id="m2-morning-bottom" class="seats-row"></div>
          </div>
        </div>
        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape"><span>MEETING 02</span></div>
            <div id="m2-afternoon-top" class="seats-row"></div>
            <div id="m2-afternoon-bottom" class="seats-row"></div>
          </div>
        </div>
      </div>

      <div class="room">
        <h3>Mesa Marketing</h3>
        <div class="shift-panel">
          <div class="shift-title">MANHÃ</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape marketing-table"><span>MARKETING</span></div>
            <div id="m3-morning-top" class="seats-row"></div>
            <div id="m3-morning-bottom" class="seats-row"></div>
          </div>
        </div>
        <div class="shift-panel">
          <div class="shift-title">TARDE</div>
          <div class="room-layout shift-layout">
            <div class="room-table-shape marketing-table"><span>MARKETING</span></div>
            <div id="m3-afternoon-top" class="seats-row"></div>

</main>

<!-- MODAL REUNIÃO -->
<div id="meeting-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title-text">Agendar Reunião</h2>
      <button class="close" onclick="closeMeetingModal()">×</button>
    </div>

    <form id="meeting-form" onsubmit="saveMeeting(event)">
      <div class="modal-body">
        <input id="m-id" type="hidden">
        <input id="m-status" type="hidden"> <!-- Para controlar aprovação do ADM -->

        <div class="form-grid">
          <div class="form-group full" style="display:flex; gap:14px; flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:120px;">
               <label>Time</label>
               <select id="m-team-select"></select>
            </div>
            <div class="form-group" style="flex:3; min-width:200px;">
               <label>Título da reunião</label>
               <input id="m-title" required placeholder="Ex.: Sprint Comercial">
            </div>
          </div>

          <div class="form-group">
            <label>Tipo de Reunião</label>
            <select id="m-type">
               <option value="Interna">Com o time (Interna)</option>
               <option value="Externa">Com externos (Externa)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Responsável</label>
            <select id="m-owner-select" required></select>
          </div>
          <div class="form-group">
            <label>Nº de pessoas</label>
            <input id="m-attendees" type="number" min="1" value="1">
          </div>
          <div class="form-group">
            <label>Data</label>
            <input id="m-date" type="date" required>
          </div>
          <div class="form-group">
            <label>Recorrência</label>
            <select id="m-recurrence">
              <option value="none">Sem recorrência</option>
              <option value="daily">Diária</option>
              <option value="weekly">Semanal</option>
              <option value="biweekly">Quinzenal</option>
              <option value="monthly">Mensal</option>
            </select>
          </div>

          <!-- SELEÇÃO DE HORÁRIO DINÂMICA (CHIPS) -->
          <div class="form-group full">
            <label>Horário de Início</label>
            <div class="chip-grid" id="chip-start"></div>
            <input id="m-start" type="hidden" required>
          </div>
          <div class="form-group full">
            <label>Horário de Fim</label>
            <div class="chip-grid" id="chip-end"></div>
            <input id="m-end" type="hidden" required>
          </div>

          <div class="form-group full">
            <label>Participantes / observações</label>
            <textarea id="m-participants" placeholder="Participantes, observações ou informações adicionais"></textarea>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="btn-delete-meeting" class="btn btn-danger" style="display:none" onclick="deleteMeeting()">Excluir</button>
        <div class="footer-right">
          <button type="button" id="btn-approve-meeting" class="btn" style="display:none; background:#16a34a; color:#fff; border:none;" onclick="approveMeeting()">Aprovar Horário</button>
          <button type="button" class="btn" onclick="closeMeetingModal()">Cancelar</button>
          <button type="submit" id="btn-save-meeting" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- O restante dos Modais (Assento, Colaborador) permanecem iguais (Foram mantidos mas encurtados aqui no visual para não estourar. O código abaixo integra com perfeição) -->

<div id="seat-modal" class="modal-backdrop">
  <div class="modal">

          <div class="form-group"><label>Recorrência</label><select id="s-recurrence"><option value="single">Apenas este dia</option><option value="daily">Todos os dias úteis</option><option value="weekly">Semanal</option><option value="biweekly">Quinzenal</option></select></div>
          <div class="form-group full"><label>Dia de exceção</label><select id="s-except-day"><option value="none">Sem exceção</option><option value="1">Segunda-feira</option><option value="2">Terça-feira</option><option value="3">Quarta-feira</option><option value="4">Quinta-feira</option><option value="5">Sexta-feira</option></select></div>

        <button type="button" id="btn-remove-seat" class="btn btn-danger" style="display:none" onclick="removeSeatAllocation()">Remover</button>
        <div class="footer-right"><button type="button" class="btn" onclick="closeSeatModal()">Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div>
      </div>
    </form>
  </div>
</div>

<div id="collab-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header"><h2>Colaboradores</h2><button class="close" onclick="closeCollabModal()">×</button></div>
    <div class="modal-body">
      <form onsubmit="saveCollaborator(event)">
        <div class="form-grid">
          <div class="form-group"><label>Nome</label><input id="c-name" required placeholder="Nome do colaborador"></div>
          <div class="form-group"><label>Equipe</label><select id="c-team" required><option value="">Selecione o time</option><option value="CSUM">CSUM</option><option value="CSUA">CSUA</option><option value="CEO">CEO</option><option value="EDFE">EDFE</option><option value="ENGO">ENGO</option><option value="ENGE">ENGE</option></select></div>
        </div>
        <br><button class="btn btn-primary" type="submit">+ Adicionar colaborador</button>
      </form>
      <hr style="border:0;border-top:1px solid #e5e7eb;margin:20px 0">
      <div id="collab-list"></div>
    </div>
  </div>
</div>

<script>

let isAdmin = false; // Controle ADM

const hours = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

function localDateString(date = new Date()) { return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`; }
function dateFromInput(value) { return new Date(`${value}T00:00:00`); }
function addDays(date,amount) { const d = new Date(date); d.setDate(d.getDate()+amount); return d; }
function startOfWeek(date) { const d = new Date(date); const day = d.getDay(); d.setDate(d.getDate() - day); d.setHours(0,0,0,0); return d; }
function minutes(time) { const [h,m] = String(time || '').slice(0,5).split(':').map(Number); return (h || 0)*60 + (m || 0); }
function esc(value) { return String(value ?? '').replace(/[&<>"']/g,char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char])); }
function setStatus(text,connected) { const el = $('connection-status'); if(el){ el.textContent = text; el.classList.toggle('offline',!connected); } }

function toggleAdminMode() {
  isAdmin = $('admin-mode-toggle').checked;

document.addEventListener('DOMContentLoaded', init);

async function init(){
  $('week-picker').value = localDateString();
  $('seat-search-date').value = localDateString();
  loadSavedLogo();
  toggleSeatShift('morning');
  renderTimeChips(); // Inicia os chips bonitos de tempo
  renderDashboard();
  renderSeats();

  if(!window.supabase){ setStatus('● Modo local',false); return; }
  try{
    db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    setStatus('● Conectando...',false);
    await Promise.race([ loadData(), new Promise((_,reject) => setTimeout(() => reject(new Error('Timeout de conexão')), 7000)) ]);
    setStatus('● Sincronizado',true);
    setupRealtime();
  }catch(error){
    console.error(error);
    setStatus('● Sem conexão',false);
    renderDashboard(); renderSeats();
  }
}

async function loadData(){
  if(!db) return;
  const [ colResult, meetResult, seatsResult ] = await Promise.all([
    db.from('collaborators').select('*').order('name'),
    db.from('meetings').select('*').order('date').order('start'),
    db.from('seat_allocations').select('*').order('startDate')
  ]);

  if(colResult.error) throw colResult.error;
  if(meetResult.error) throw meetResult.error;
  if(seatsResult.error) throw seatsResult.error;

  collaborators = colResult.data || [];
  seatAllocations = seatsResult.data || [];

  // Mapeia o Status de Reunião pelo título PENDENTE (fallback seguro para não quebrar banco existente)
  meetings = (meetResult.data || []).map(m => {
    if (m.title && m.title.startsWith('[PENDENTE] ')) {
      m.title = m.title.replace('[PENDENTE] ', '');
      m.status = 'pending';
    } else if (!m.status) {
      m.status = 'approved';
    }
    return m;
  });

  renderDashboard(); renderSeats();
}

function toggleSeatShift(shift) { /* Mantido igual */
  $('btn-shift-morning').classList.toggle('active', shift === 'morning');

  document.querySelectorAll('.shift-panel').forEach(panel => {

let agendaView = 'weekly';
function toggleAgendaView(){ agendaView = agendaView === 'weekly' ? 'daily' : 'weekly'; $('view-toggle-btn').textContent = agendaView === 'weekly' ? 'Visualização: Semanal' : 'Visualização: Diária'; renderDashboard(); }
function changePeriod(amount){ const input = $('week-picker'); const date = dateFromInput(input.value || localDateString()); date.setDate(date.getDate() + amount * (agendaView === 'weekly' ? 7 : 1)); input.value = localDateString(date); renderDashboard(); }

function meetingOccursOnDate(meeting,targetDate){ /* Mantido igual (validação de datas) */ 
  if(!meeting || !meeting.date) return false;
  const start = dateFromInput(meeting.date); const target = dateFromInput(targetDate);
  if(target < start) return false;
  switch(meeting.recurrence || 'none'){
    case 'none': return (meeting.date === targetDate);
    case 'daily': return (target.getDay() >= 1 && target.getDay() <= 5);
    case 'weekly': return (target.getDay() === start.getDay());
    case 'biweekly': return (Math.floor((target-start)/86400000) >= 0 && Math.floor((target-start)/86400000) % 14 === 0);
    case 'monthly': return (target.getDate() === start.getDate());
    default: return false;
  }
}

// GERAÇÃO DOS CARDS NO CALENDÁRIO COM HORÁRIO/ALTURA 100% PRECISOS
function renderDashboard(){
  const container = $('weekly-table'); if(!container) return;
  const selected = $('week-picker').value || localDateString(); const selectedDate = dateFromInput(selected);

  function eventMarkup(meeting, hourStart){
    const start = minutes(meeting.start);
    const end = minutes(meeting.end);
    const safeEnd = Math.max(end, start + 15);
    const durationHours = (safeEnd - start) / 60; // Duração exata
    const offsetPercent = ((start - hourStart) / 60) * 100; // Offset exato

    const encoded = encodeURIComponent(JSON.stringify(meeting));
    const typeBadge = meeting.type === 'Externa' ? '<span style="color:#fca5a5">[Ext]</span> ' : '';
    const teamBadge = meeting.team ? `${esc(meeting.team)} | ` : '';
    
    // Sem "Responsável", apenas o nome
    const ownerText = meeting.owner ? esc(meeting.owner) : '—';
    const pendingClass = meeting.status === 'pending' ? 'pending-event' : '';

    return `<div class="event-card ${pendingClass}"
      style="top:${Math.max(0,offsetPercent)}%; height:calc(${durationHours * 100}% - 4px);"
      onclick="event.stopPropagation();openMeetingModalFromEncoded('${encoded}')">
      <div class="event-title">${typeBadge}${teamBadge}${esc(meeting.title)}</div>
      <div class="event-time">${esc(String(meeting.start || '').slice(0,5))} - ${esc(String(meeting.end || '').slice(0,5))}</div>
      <div class="event-owner">${ownerText}</div>
    </div>`;
  }

  // Gera o HTML do calendário dinamicamente (Mantido e otimizado com flexbox/grid)
  if(agendaView === 'daily'){
    const target = localDateString(selectedDate);
    const dayName = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][selectedDate.getDay()];
    $('week-label').textContent = `${dayName} - ${pad(selectedDate.getDate())}/${pad(selectedDate.getMonth()+1)}`;
    let html = '<div class="grid-header">Hora</div>';
    html += `<div class="grid-header"><strong>${dayName}</strong><br><small>${pad(selectedDate.getDate())}/${pad(selectedDate.getMonth()+1)}</small></div>`;
    
    hours.forEach(hour => {
      const hourStart = minutes(hour); const hourEnd = hourStart + 60;
      html += `<div class="time-slot">${hour}</div>`;
      const events = meetings.filter(m => meetingOccursOnDate(m,target)).filter(m => { const s = minutes(m.start); return s >= hourStart && s < hourEnd; }).sort((a,b) => minutes(a.start) - minutes(b.start));
      html += `<div class="day-cell" onclick="handleSlotClick('${target}','${hour}')">`;
      events.forEach(meeting => html += eventMarkup(meeting, hourStart));
      html += '</div>';
    });
    container.className = 'calendar agenda-export-area daily-calendar'; container.innerHTML = html; return;
  }

  const sunday = startOfWeek(selectedDate);
  const days = Array.from({length:7},(_,index)=>addDays(sunday,index));
  $('week-label').textContent = `${pad(days[0].getDate())}/${pad(days[0].getMonth()+1)} - ${pad(days[6].getDate())}/${pad(days[6].getMonth()+1)}`;
  let html = '<div class="grid-header">Hora</div>';
  const names = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  days.forEach((day,index) => { html += `<div class="grid-header"><strong>${names[index]}</strong><br><small>${pad(day.getDate())}/${pad(day.getMonth()+1)}</small></div>`; });
  
  hours.forEach(hour => {
    const hourStart = minutes(hour); const hourEnd = hourStart + 60;
    html += `<div class="time-slot">${hour}</div>`;
    days.forEach(day => {
      const target = localDateString(day);
      const events = meetings.filter(m => meetingOccursOnDate(m,target)).filter(m => { const s = minutes(m.start); return s >= hourStart && s < hourEnd; }).sort((a,b) => minutes(a.start) - minutes(b.start));
      html += `<div class="day-cell" onclick="handleSlotClick('${target}','${hour}')">`;
      events.forEach(meeting => html += eventMarkup(meeting, hourStart));
      html += '</div>';
    });
  });
  container.className = 'calendar agenda-export-area'; container.innerHTML = html;
}

// GERADOR DO TIME PICKER (SELEÇÃO DE CHIPS DINÂMICOS)
function renderTimeChips() {
  const startContainer = $('chip-start');
  const endContainer = $('chip-end');
  const hoursList = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
  startContainer.innerHTML = hoursList.map(h => `<div class="time-chip" onclick="selectTime('start', '${h}')" id="chip-start-${h.replace(':','')}">${h}</div>`).join('');
  endContainer.innerHTML = hoursList.map(h => `<div class="time-chip" onclick="selectTime('end', '${h}')" id="chip-end-${h.replace(':','')}">${h}</div>`).join('');
}

function selectTime(type, time) {
  $(`m-${type}`).value = time;
  document.querySelectorAll(`#chip-${type} .time-chip`).forEach(el => el.classList.remove('active'));
  const el = $(`chip-${type}-${time.replace(':','')}`);
  if(el) el.classList.add('active');
}

function handleSlotClick(date, hour){
  const next = parseInt(hour.slice(0,2),10) + 1;
  if(next > 19) return;
  openMeetingModal({ date, start:hour, end:`${pad(next)}:00` });
}

function fillOwnerSelect(){ /* Mantido igual */
  const select = $('m-owner-select'); select.innerHTML = '';
  if(!collaborators.length){ select.innerHTML = `<option value="">Cadastre um colaborador primeiro</option>`; return; }
  collaborators.forEach(collaborator => { const option = document.createElement('option'); option.value = collaborator.name; option.textContent = `${collaborator.name} (${collaborator.team || ''})`; select.appendChild(option); });
}

function fillTeamSelect() { /* Mantido igual */
  const select = $('m-team-select'); const defaultTeams = ['CSUM', 'CSUA', 'CEO', 'EDFE', 'ENGO', 'ENGE'];
  const collTeams = collaborators.map(c => c.team).filter(t => defaultTeams.includes(t));
  const allTeams = [...new Set([...defaultTeams, ...collTeams])];
  select.innerHTML = '<option value="">Sem time</option>' + allTeams.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

function openMeetingModal(data = null){
  fillOwnerSelect(); fillTeamSelect();
  $('meeting-form').reset();
  
  $('m-id').value = data?.id || '';
  $('m-title').value = data?.title || '';
  $('m-team-select').value = data?.team || '';
  $('m-type').value = data?.type || 'Interna';
  $('m-owner-select').value = data?.owner || collaborators[0]?.name || '';
  $('m-attendees').value = data?.attendees_count || 1;
  $('m-participants').value = data?.participants || '';
  $('m-date').value = data?.date || $('week-picker').value || localDateString();
  $('m-recurrence').value = data?.recurrence || 'none';

  // Configuração do Status / Modo de Aprovação
  const status = data?.status || (isAdmin ? 'approved' : 'pending');
  $('m-status').value = status;
  
  if (data?.id && status === 'pending' && isAdmin) {
    $('btn-approve-meeting').style.display = 'inline-flex';
    $('btn-save-meeting').textContent = 'Salvar Alterações';
  } else if (status === 'pending' && !isAdmin) {
    $('btn-approve-meeting').style.display = 'none';
    $('btn-save-meeting').textContent = 'Salvar Solicitação';
  } else {
    $('btn-approve-meeting').style.display = 'none';
    $('btn-save-meeting').textContent = 'Salvar Reunião';
  }

  // Preenche Chips de tempo
  document.querySelectorAll('.time-chip').forEach(el => el.classList.remove('active'));
  $('m-start').value = ''; $('m-end').value = '';
  if(data?.start) selectTime('start', String(data.start).slice(0,5));
  if(data?.end) selectTime('end', String(data.end).slice(0,5));

  $('modal-title-text').textContent = data?.id ? (isAdmin ? 'Editar / Aprovar Reunião' : 'Detalhes da Reunião') : (isAdmin ? 'Agendar Reunião' : 'Solicitar Reunião');
  $('btn-delete-meeting').style.display = data?.id ? 'inline-flex' : 'none';
  $('meeting-modal').style.display = 'flex';
}

function openMeetingModalFromEncoded(encoded){ try{ openMeetingModal(JSON.parse(decodeURIComponent(encoded))); }catch(error){ console.error(error); alert('Não foi possível abrir a reunião.'); } }
function closeMeetingModal(){ $('meeting-modal').style.display = 'none'; }
function approveMeeting() { $('m-status').value = 'approved'; $('btn-save-meeting').click(); }

async function saveMeeting(event){
  event.preventDefault();
  if(!db){ alert('Supabase indisponível no momento.'); return; }
  
  const id = $('m-id').value;
  const owner = $('m-owner-select').value;
  const data = {
    title: $('m-title').value.trim(), owner, team: $('m-team-select').value, type: $('m-type').value,
    attendees_count: parseInt($('m-attendees').value,10) || 1, participants: $('m-participants').value.trim(),
    date: $('m-date').value, start: $('m-start').value, end: $('m-end').value, recurrence: $('m-recurrence').value,
    status: $('m-status').value // Status novo!
  };

  if(!data.title || !data.owner || !data.date || !data.start || !data.end){ alert('Preencha os campos obrigatórios (incluindo Início e Fim).'); return; }

  try{
    let response;
    
    // Tratativa Fallback caso o Supabase atual do usuário não possua a coluna status na tabela
    const fallbackData = {...data};
    delete fallbackData.type;
    delete fallbackData.status;

    if(data.type) fallbackData.participants = `[${data.type}] ` + fallbackData.participants;
    if(data.status === 'pending') fallbackData.title = `[PENDENTE] ` + fallbackData.title;

    if(id){ response = await db.from('meetings').update(fallbackData).eq('id',id).select().single(); }
    else{ response = await db.from('meetings').insert([fallbackData]).select().single(); }
    if(response.error) throw response.error;

    closeMeetingModal(); await loadData(); setStatus('● Sincronizado',true);
    if(!isAdmin && data.status === 'pending') alert("Solicitação enviada e aguardando aprovação!");
  }catch(error){
    console.error(error);
    alert('Erro ao salvar: ' + error.message);
  }
}

async function deleteMeeting(){ /* Exatamente igual, omitido por espaço... */ 
  const id = $('m-id').value;
  if(!id || !confirm('Excluir esta reunião?')) return;
  if(!db) return;
  try{ const {error} = await db.from('meetings').delete().eq('id',id); if(error) throw error; closeMeetingModal(); await loadData(); }catch(error){ alert('Erro: ' + error.message); }
}
