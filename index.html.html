<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOJA CONCEITO BE | Coworking Pro BE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{--ink:#111;--page:#c8c8c8;--panel:#d9d9d9;--gray:#646464;--paper:#fafafa;--coral:#ff5657;--line:rgba(17,17,17,.22);--line-strong:#8a8a8a;--muted:#4d4d4d;--hover:#ececec;--surface-soft:#e9e9e9;--row:3.3rem}
html{font-size:clamp(11px,.8334vw,16px);font-family:'N27','Space Grotesk','Montserrat',sans-serif}
body{margin:0;background:var(--page);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hid{position:absolute;left:1.9rem;top:7rem;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}

/* topo */
#app-shell{height:100vh;display:flex;flex-direction:column}
.top{flex:none;background:#000;color:#fff;height:9.9rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 1.9rem}
.brand{display:flex;align-items:center;gap:.9rem}
.logo-upload{display:block;height:5.6rem;cursor:pointer}
.logo-upload input{display:none}
.logo-upload img{display:block;height:100%;width:auto;max-width:7.5rem;object-fit:contain}
.logo-upload.locked{cursor:default}
.brand-t{font-size:1.3rem;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:-.01em}
.tabs{display:flex;gap:2.2rem}
.tabbtn{padding:.5rem .1rem;border:0;border-bottom:.15rem solid transparent;border-radius:0;background:none;color:#8a8a8a;font-weight:700;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;transition:color .15s,border-color .15s}
.tabbtn:hover{color:#fff}
.tabbtn.active{color:#fff;border-bottom-color:#fff}
.user{justify-self:end;text-align:right}
.user strong{display:block;font-size:1.6rem;font-weight:700;text-transform:uppercase;line-height:1.1}
.user small{display:block;font-size:.85rem;text-transform:uppercase;margin-top:.25rem}
.user-act{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.6rem}
.pill{height:2rem;padding:0 1rem;border-radius:1rem;border:0;background:var(--gray);color:#fff;font-weight:700;font-size:.85rem;text-transform:uppercase;white-space:nowrap}
.pill.active{background:var(--paper);color:var(--ink)}
.pill.red{background:var(--coral);color:var(--ink)}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.2rem;height:1.2rem;padding:0 .3rem;border-radius:1rem;background:var(--coral);color:var(--ink);font-size:.7rem;font-weight:700;margin-left:.4rem}
.tab-badge:empty{display:none}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.ttl{font-size:2.3rem;font-weight:700;text-transform:uppercase;display:flex;align-items:baseline;justify-content:center;gap:.9rem;white-space:nowrap;line-height:1.1}
.ttl span{font-size:1.2rem;font-weight:400;border-left:.18rem solid var(--ink);padding-left:.9rem;line-height:1.3}
.arr{background:none;border:0;font-size:2.6rem;font-weight:700;line-height:1;padding:0 .3rem;color:var(--ink)}

/* agenda */
.bar{position:relative;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;min-height:7.4rem;padding:1.4rem 1.9rem .6rem}
.mon{display:flex;align-items:baseline;gap:.7rem;background:none;border:0;padding:0;text-align:left}
.mon b{font-size:4.6rem;line-height:.95;font-weight:700;color:var(--gray);letter-spacing:-.02em}
.mon i{font-style:normal;font-size:2rem;font-weight:700;color:#fff}
.acts{justify-self:end;display:flex;gap:.7rem;align-items:center}
.gbtn{height:3.6rem;padding:0 1.5rem;border-radius:1rem;border:0;background:var(--gray);color:var(--ink);font-weight:700;font-size:1.2rem;text-transform:uppercase;white-space:nowrap}
.gbtn.sm{height:2.6rem;padding:0 1rem;font-size:.85rem;color:#fff}
.gbtn:hover,.pill:hover{filter:brightness(1.12)}
.cal-wrap{flex:1;min-height:0;overflow:auto;scrollbar-width:auto;scrollbar-color:#111 transparent;overscroll-behavior:contain;scroll-behavior:smooth;scroll-padding-top:8rem}
.cal-wrap::-webkit-scrollbar{width:.8rem;height:.8rem}.cal-wrap::-webkit-scrollbar-thumb{background:#111;border-radius:1rem;border:.2rem solid var(--page)}
.now{position:absolute;left:0;right:0;height:.18rem;background:var(--coral);z-index:5;pointer-events:none}.now::before{content:'';position:absolute;left:-.35rem;top:-.28rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--coral)}
.cal{display:grid;grid-template-columns:6.75rem repeat(var(--cols,7),minmax(9rem,1fr)) 6.1rem;min-width:62rem;padding-bottom:1.2rem}
.cal.swap{animation:fadeIn .2s ease-out}
.gh,.dh{position:sticky;top:0;z-index:7;background:var(--page)}
.gh{display:flex;align-items:flex-end;padding:0 0 .2rem 1.5rem}
.gh:last-of-type{padding:0 0 .2rem 1.6rem}
.dh{display:flex;flex-direction:column;justify-content:flex-end}
.dn{font-size:1.1rem;font-weight:700;padding-left:1rem;line-height:1.3}
.dd{font-size:3.8rem;font-weight:700;line-height:1.1;color:#fff;text-align:right;padding-right:2.6rem;border-left:.125rem solid var(--ink)}
.dh.f .dd{border-left:0}
.dh.today .dd{color:var(--ink)}
.sp{height:1.7rem}
.k{border-left:.125rem solid var(--ink)}
.tl{position:relative;height:var(--row)}
.tl span{position:absolute;left:1.9rem;top:0;transform:translateY(-50%);font-size:1.1rem;font-weight:500;color:#fff;white-space:nowrap}
.c{position:relative;height:var(--row);border-top:.125rem solid #fff;cursor:pointer}
.c:hover{background:rgba(255,255,255,.16)}
.c.sel{background:rgba(0,0,0,.14)}
.c.end{height:1.2rem;cursor:default}.c.end:hover{background:none}
.ev{position:absolute;left:.5rem;right:.5rem;top:calc(var(--o)*var(--row) + .25rem);height:calc(var(--d)*var(--row) - .5rem);z-index:3;overflow:hidden;padding:.2rem .5rem;border-radius:.5rem;background:var(--cc);color:var(--tc);font-size:.85rem;line-height:1.25;text-transform:uppercase;cursor:pointer}
.ev:hover{filter:brightness(1.08);z-index:4}
.ev.pend{background:transparent;color:var(--ink);border:.125rem dashed var(--cc);padding:.075rem .375rem}
.ev-t,.ev-c{font-weight:700}
.ev-o,.ev-h{font-size:.8rem;font-weight:400}
.ev>div{overflow-wrap:anywhere}
.ev-c{display:none}
.cal,.cal *{user-select:none;-webkit-user-select:none}

/* mapa de lugares */
.sbar{flex:none;display:flex;align-items:center;gap:4.5rem;padding:1.6rem 1.9rem 1.4rem;position:relative}
.sdate{display:flex;align-items:baseline;gap:.5rem;justify-self:start}
.dpick{display:flex;align-items:baseline;gap:.6rem;background:none;border:0;padding:0;color:var(--gray)}
.dpick b{font-size:4.6rem;line-height:.95;font-weight:700}
.dpick em{font-style:normal;font-size:2.8rem;font-weight:700}
.dpick i{font-style:normal;font-size:1.1rem;font-weight:700;color:#fff}
.sgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 16.9rem;gap:.8rem;padding:0 1.9rem 1.9rem}
.board,.side{background:var(--panel);border:.19rem solid var(--ink);border-radius:2.1rem}
.board{padding:1.4rem 2.8rem 2.4rem;display:flex;flex-direction:column;min-height:0}
.shifts{display:flex;gap:1.4rem;margin-bottom:2rem;flex:none}
.shift{min-width:13rem;padding:0 1.4rem;height:4.4rem;border-radius:1.3rem;border:.1rem solid var(--ink);background:var(--gray);color:#fff;font-weight:700;font-size:1.1rem;text-transform:uppercase}
.shift.active{background:var(--paper);color:var(--ink)}
.groups{flex:1;min-height:0;display:grid;grid-template-columns:25.3fr 25.4fr 31.8fr;column-gap:4.6rem}
.grp{position:relative;min-height:0;display:grid;grid-template-rows:minmax(3.2rem,1fr) minmax(6rem,2.1fr) minmax(3.2rem,1fr);gap:.7rem}
.grp+.grp::before{content:'';position:absolute;left:-2.4rem;top:12%;bottom:12%;border-left:.12rem solid var(--ink)}
.row{min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.7rem}
.ch{height:auto;min-height:0;padding:.3rem;border:.125rem solid var(--ink);border-radius:1.2rem;background:var(--paper);color:#c4c4c4;font-weight:700;font-size:1rem;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;cursor:pointer;transition:transform .12s}
.ch.occ{background:#111;color:#fff}
.ch.split{padding:0;flex-direction:column;overflow:hidden;cursor:default;background:none}.ch.split:hover{transform:none}
.half{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;gap:.4rem;background:var(--paper);color:#c4c4c4;font-size:.85rem;cursor:pointer}.half.occ{background:#111;color:#fff}.half+.half{border-top:.125rem solid var(--ink)}.half::before{content:attr(data-p);font-size:.6rem;opacity:.55}.half:hover{filter:brightness(.94)}
.ch:hover{transform:translateY(-.15rem)}
.tbl{height:auto;min-height:0;border:.125rem solid var(--ink);border-radius:1.3rem;background:#111;color:#fff;display:grid;place-items:center;font-size:1.25rem;font-weight:700;text-transform:uppercase}
.side{position:relative}
.side-in{position:absolute;inset:1.6rem .9rem 1.2rem;display:flex;flex-direction:column;min-height:0}
.side h3{margin:0 0 1.1rem;font-size:1.3rem;font-weight:700;text-transform:uppercase;white-space:nowrap}
.search{display:flex;align-items:center;gap:.5rem;height:3.3rem;padding:0 .8rem;border-radius:1rem;border:.1rem solid var(--line-strong);background:var(--paper);flex:none}
.search svg{width:1.1rem;height:1.1rem;flex:none;color:#9a9a9a}
.search input{border:0;outline:0;background:none;width:100%;min-width:0;font-weight:700;font-size:.95rem;text-transform:uppercase}
.search input::placeholder{color:#b3b3b3}
.cs-list{flex:1;min-height:0;overflow:auto;margin:1.2rem 0 .6rem;scrollbar-width:thin}
.cs-g{margin:.9rem 0 .25rem;padding-bottom:.25rem;border-bottom:.08rem solid var(--line);font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--coral);text-transform:uppercase}
.cs-g:first-child{margin-top:0}
.cs-n{padding:.18rem 0 .18rem .15rem;font-size:.85rem;font-weight:500;text-transform:uppercase;line-height:1.25;overflow-wrap:anywhere}
.side .pill{align-self:flex-start;flex:none}

/* solicitações */
.pad{padding:0 1.9rem 2rem;overflow:auto;flex:1;min-height:0}
.request-card{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.4rem;margin-bottom:.8rem;background:var(--panel);border:.19rem solid var(--ink);border-radius:1.6rem}
.request-card-main{display:flex;align-items:flex-start;gap:.6rem}
.request-title{font-size:1.05rem;font-weight:700;text-transform:uppercase}
.request-meta{font-size:.95rem;margin-top:.2rem;color:var(--muted);text-transform:uppercase}
.request-actions{display:flex;gap:.5rem}
.status-pill{font-size:.8rem;font-weight:700;background:var(--gray);color:#fff;padding:.4rem .9rem;border-radius:1rem;text-transform:uppercase}
.cat-dot{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;background:var(--cat-color,#646464);margin-top:.35rem}
.empty-state{text-align:center;padding:1.5rem;color:var(--muted);font-weight:500}

/* auth, modais, formulários (em = base de 14–16px) */
#view-auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:var(--page)}
.auth-card,.modal{background:var(--panel);border:.19rem solid var(--ink);border-radius:1.6em;font-size:max(14px,1rem)}
.auth-card{width:100%;max-width:25em;padding:2em}
.auth-logo{font-size:1.3em;font-weight:700;text-transform:uppercase;text-align:center;margin-bottom:1.2em}
.auth-title{font-size:1.1em;font-weight:700;text-transform:uppercase;text-align:center;margin-bottom:1em}
.auth-field,.form-group{display:flex;flex-direction:column;gap:.4em;margin-bottom:.9em}
.form-group{margin-bottom:0}
.auth-field label,.form-group label{font-size:.75em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.auth-field input,.form-group input,.form-group select,.form-group textarea{border:.08em solid var(--ink);border-radius:.8em;padding:.65em .8em;background:var(--paper);font-weight:500;width:100%}
.form-group input[readonly]{background:var(--surface-soft);color:var(--muted)}
.form-group input:disabled,.form-group select:disabled,.form-group textarea:disabled{opacity:.75}
.form-group textarea{min-height:5em;resize:vertical}
input:focus,select:focus,textarea:focus{outline:.15em solid var(--gray);outline-offset:1px}
.auth-error{color:#b3261e;font-size:.85em;min-height:1.3em;margin-bottom:.5em;text-align:center;font-weight:700}
.auth-submit{width:100%;background:var(--ink);color:#fff;border:0;border-radius:.9em;padding:.8em;font-weight:700;text-transform:uppercase;margin-top:.4em}
.auth-switch{text-align:center;font-size:.85em;margin-top:1.2em;font-weight:500}
.auth-switch a{font-weight:700;cursor:pointer;text-decoration:underline}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s ease-out}
.modal{width:100%;max-width:38em;max-height:90vh;overflow:auto;animation:modalIn .22s ease-out}
.modal-header{padding:1.1em 1.4em;border-bottom:.08em solid var(--ink);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{margin:0;font-size:1.2em;font-weight:700;text-transform:uppercase}
.close{border:0;background:none;font-size:1.8em;line-height:1;font-weight:400}
.modal-body{padding:1.4em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.form-group.full{grid-column:1/-1}
.modal-footer{padding:1em 1.4em;border-top:.08em solid var(--ink);display:flex;justify-content:space-between;gap:.6em}
.footer-right{display:flex;gap:.6em}
.btn{border:.1em solid var(--ink);background:var(--paper);padding:.6em 1em;border-radius:.8em;font-weight:700;font-size:.85em;text-transform:uppercase}
.btn:hover{background:#fff}
.btn-primary{background:var(--ink);color:#fff}.btn-primary:hover{background:#2a2a2a}
.btn-danger{background:var(--coral);color:var(--ink)}.btn-danger:hover{background:#ff7173}
.user-row{display:flex;justify-content:space-between;align-items:center;padding:.6em 0;border-bottom:.08em solid var(--line);gap:.6em;flex-wrap:wrap;font-size:.9em}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* seletor de horário */
.time-input{font-variant-numeric:tabular-nums;cursor:text}
.time-input.invalid{border-color:#b3261e !important;outline:.15em solid rgba(179,38,30,.3)}
#time-popover{position:fixed;z-index:300;display:none;min-width:150px;max-height:240px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;background:var(--paper);border:.1rem solid var(--ink);border-radius:12px;padding:6px;font-size:14px}
#time-popover.open{display:block;animation:popIn .14s ease-out}
.time-opt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 10px;border-radius:8px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.time-opt small{font-size:11px;font-weight:500;color:var(--muted)}
.time-opt:hover,.time-opt.active{background:var(--hover)}
.time-opt.selected{background:var(--ink);color:#fff}.time-opt.selected small{color:rgba(255,255,255,.7)}
.time-opt.busy{opacity:.45;cursor:not-allowed}.time-opt.busy:hover{background:transparent}
:focus-visible{outline:.15rem solid var(--gray);outline-offset:2px}

@media(max-width:1000px){
  html{font-size:13px}
  #app-shell{height:auto;min-height:100vh}
  .top{grid-template-columns:1fr;height:auto;gap:1rem;padding:1rem;justify-items:center}
  .user{justify-self:center;text-align:center}.user-act{justify-content:center}
  .tabs{flex-wrap:wrap;justify-content:center;gap:1.4rem}
  .bar{grid-template-columns:1fr;justify-items:start}.acts{justify-self:start;flex-wrap:wrap}
  .ttl{flex-wrap:wrap;white-space:normal}
  .cal-wrap{flex:none;height:75vh}
  .sbar{flex-wrap:wrap;gap:1rem}
  .sgrid{flex:none;grid-template-columns:1fr}.groups{flex:none;grid-template-columns:1fr;row-gap:2rem}.grp{grid-template-rows:6rem 12rem 6rem}.grp+.grp::before{display:none}
  .side{min-height:26rem}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}
}
@media(max-height:820px) and (min-width:1001px){.top{height:7.6rem}.logo-upload{height:4.6rem}.bar{min-height:6.4rem;padding-top:1rem}.shift{height:3.6rem}.shifts{margin-bottom:1.2rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

<body>

<section id="view-auth">
  <div class="auth-card">
    <div class="auth-logo">Loja Conceito BE</div>
    <div class="auth-title" id="auth-title">Entrar</div>
    <div class="auth-error" id="auth-error"></div>

    <form onsubmit="handleAuthSubmit(event)">
      <div id="auth-signup-fields" style="display:none">
        <div class="auth-field">
          <label>Nome</label>
          <input id="auth-first-name" placeholder="Nome">
        </div>
        <div class="auth-field">
          <label>Sobrenome</label>
          <input id="auth-last-name" placeholder="Sobrenome">
        </div>
      </div>

      <div class="auth-field">
        <label>Email corporativo</label>
        <input id="auth-email" type="email" placeholder="seu@email.com" required>
      </div>

      <div class="auth-field">
        <label>Senha</label>
        <input id="auth-password" type="password" required minlength="6">
      </div>

      <div class="auth-field" id="auth-confirm-field" style="display:none">
        <label>Confirmar senha</label>
        <input id="auth-password-confirm" type="password" minlength="6">
      </div>

      <button type="submit" class="auth-submit" id="auth-submit-btn">Entrar</button>
    </form>

    <div class="auth-switch">
      <span id="auth-toggle-text">Não tem conta?</span>
      <a id="auth-toggle-link" onclick="setAuthMode(authMode === 'login' ? 'signup' : 'login')">Criar conta</a>
    </div>
  </div>
</section>

<div id="app-shell" style="display:none">

<header class="top">
  <div class="brand">

<!-- MODAL REUNIÃO -->

<div id="meeting-modal" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title-text">Agendar Reunião</h2>
      <button class="close" onclick="closeMeetingModal()">×</button>
    </div>

    <form id="meeting-form" onsubmit="saveMeeting(event)">
      <div class="modal-body">
        <input id="m-id" type="hidden">

        <div class="form-grid">

          <div class="form-group full" style="display:flex; gap:14px; flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:120px;">
               <label>Departamento</label>
               <select id="m-team-select"></select>
            </div>
            <div class="form-group" style="flex:3; min-width:200px;">
               <label>Título da reunião</label>
               <input id="m-title" required placeholder="Ex.: Sprint Comercial">
            </div>
          </div>

          <div class="form-group">
            <label>Reunião com</label>
            <select id="m-category" required>
              <option value="time">Time (interno)</option>
              <option value="fornecedor">Fornecedor</option>
              <option value="cliente">Cliente</option>
              <option value="lead">Lead</option>
              <option value="corretor">Corretor</option>
            </select>
          </div>

          <div class="form-group">
            <label>Solicitante</label>
            <input id="m-owner-display" readonly>
          </div>

          <div class="form-group">
            <label>Nº de pessoas</label>
            <input id="m-attendees" type="number" min="1" value="1">
          </div>

          <div class="form-group">
            <label>Data</label>
            <input id="m-date" type="date" required>
          </div>

          <div class="form-group">
            <label>Recorrência</label>
            <select id="m-recurrence">
              <option value="none">Sem recorrência</option>
              <option value="daily">Diária</option>
              <option value="weekly">Semanal</option>
              <option value="biweekly">Quinzenal</option>
              <option value="monthly">Mensal</option>
            </select>
          </div>

          <div class="form-group">
            <label>Início</label>
            <input id="m-start" class="time-input" type="text" inputmode="numeric" autocomplete="off" placeholder="00:00" maxlength="5" required>
          </div>

          <div class="form-group">
            <label>Fim</label>
            <input id="m-end" class="time-input" type="text" inputmode="numeric" autocomplete="off" placeholder="00:00" maxlength="5" required>
          </div>

          <div class="form-group full">
            <label>Participantes / observações</label>
            <textarea id="m-participants" placeholder="Participantes, observações ou informações adicionais"></textarea>
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="btn-delete-meeting" class="btn btn-danger" style="display:none" onclick="deleteMeeting()">Excluir</button>
        <div class="footer-right">
          <button type="button" class="btn" onclick="closeMeetingModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-save-meeting">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- MODAL ASSENTO -->

<div id="seat-modal" class="modal-backdrop">
  <div class="modal">

function changePeriod(amount){

function changeWeek(amount){ changePeriod(amount); }

function meetingOccursOnDate(meeting, targetDate){
  if(!meeting || !meeting.date) return false;

  const start = dateFromInput(meeting.date);
  const target = dateFromInput(targetDate);

  if(target < start) return false;

  switch(meeting.recurrence || 'none'){
    case 'none':
      return meeting.date === targetDate;
    case 'daily':
      return target.getDay() >= 1 && target.getDay() <= 5;
    case 'weekly':
      return target.getDay() === start.getDay();
    case 'biweekly':{
      const difference = Math.floor((target-start) / 86400000);
      return difference >= 0 && difference % 14 === 0;
    }
    case 'monthly':
      return target.getDate() === start.getDate();
    default:
      return false;
  }
}

function eventMarkup(m, slotMin){
  const s = minutes(m.start);
  const e = Math.max(minutes(m.end), s + 15);
  const pend = m.status === 'pending';
  const owner = m.requested_by_name || m.owner || '';
  const t = `${m.team ? m.team + ' | ' : ''}${m.title || ''}`;
  const hh = `${String(m.start || '').slice(0,5)} - ${String(m.end || '').slice(0,5)}`;
  const tip = [t, owner, hh, pend ? '(pendente de aprovação)' : ''].filter(Boolean).join(' — ');

  return `<div class="ev${pend ? ' pend' : ''}" data-id="${esc(m.id)}" title="${esc(tip)}"
    style="--o:${(s - slotMin) / 30};--d:${(e - s) / 30};--cc:${teamColor(m.team)};--tc:${teamTextColor(m.team)}">
    <div class="ev-t">${esc(t)}</div>${owner ? `<div class="ev-o">${esc(owner)}</div>` : ''}<div class="ev-h">${esc(hh)}</div>${m.team ? `<div class="ev-c">${esc(m.team)}</div>` : ''}
  </div>`;
}

/* Mostra só o que cabe inteiro no bloco: nada é cortado pela metade */
function fitCards(){
  document.querySelectorAll('#weekly-table .ev').forEach(card => {
    const p = {t:card.querySelector('.ev-t'), o:card.querySelector('.ev-o'), h:card.querySelector('.ev-h'), c:card.querySelector('.ev-c')};
    const show = (keys, size) => {
      card.style.fontSize = size + 'rem';
      Object.keys(p).forEach(k => { if(p[k]) p[k].style.display = keys.includes(k) ? 'block' : 'none'; });
    };
    const fits = () => card.scrollHeight <= card.clientHeight + 1 && card.scrollWidth <= card.clientWidth + 1;
    const tries = [['t','o','h'], ['t','o'], ['t','h'], ['t']].map(k => [k, .85]).concat([[['t'], .75], [['t'], .65], [['c'], .85]]);
    for(const [keys, size] of tries){
      show(keys, size);
      if(fits()) return;
    }
    show([], .85);
  });
}

let fitQueued = false;
function queueFit(){
  if(fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitCards(); });
}
window.addEventListener('resize', queueFit);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);

function renderDashboard(){
  const container = $('weekly-table');
  if(!container) return;

  const selected = dateFromInput($('week-picker').value || localDateString());
  const todayStr = localDateString();
  const days = agendaView === 'daily'
    ? [selected]
    : Array.from({length:7}, (_, i) => addDays(startOfWeek(selected), i));
  const names = ['DOM.','SEG.','TER.','QUA.','QUI.','SEX.','SÁB.'];

  $('cal-mon').innerHTML = `<b>${MONTHS[selected.getMonth()]}</b><i>${selected.getFullYear()}</i>`;
  container.style.setProperty('--cols', days.length);

  const byDay = {};
  days.forEach(d => {
    const ds = localDateString(d);
    byDay[ds] = meetings.filter(m => m.status !== 'rejected' && meetingOccursOnDate(m, ds));
  });

  let html = '<div class="gh"><button class="arr" onclick="changePeriod(-1)" aria-label="Anterior">&lt;</button></div>';
  days.forEach((d, i) => {
    html += `<div class="dh${i ? '' : ' f'}${localDateString(d) === todayStr ? ' today' : ''}"><div class="dn">${names[d.getDay()]}</div><div class="dd">${pad(d.getDate())}</div></div>`;
  });
  html += '<div class="gh"><button class="arr" onclick="changePeriod(1)" aria-label="Próximo">&gt;</button></div>';

  html += '<div class="sp"></div>';
  days.forEach((_, i) => { html += `<div class="sp${i ? ' k' : ''}"></div>`; });
  html += '<div class="sp"></div>';

  SLOTS.forEach((slot, si) => {
    const label = fmtTime(slot);
    html += `<div class="tl"><span>${label}</span></div>`;
    days.forEach((d, i) => {
      const ds = localDateString(d);
      const evs = byDay[ds]
        .filter(m => { const s = minutes(m.start); return s >= slot && s < slot + 30; })
        .sort((a, b) => minutes(a.start) - minutes(b.start));
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      const nowLine = (ds === todayStr && nowMin >= slot && nowMin < slot + 30) ? `<div class="now" style="top:calc(${(nowMin - slot) / 30} * var(--row))"></div>` : '';
      html += `<div class="c${i ? ' k' : ''}" data-date="${ds}" data-hi="${si}" onclick="handleSlotClick(event,'${ds}','${label}')">${evs.map(m => eventMarkup(m, slot)).join('')}${nowLine}</div>`;
    });
    html += '<div></div>';
  });

  html += '<div class="tl" style="height:1.2rem"><span>19:00</span></div>';
  days.forEach((_, i) => { html += `<div class="c end${i ? ' k' : ''}"></div>`; });
  html += '<div></div>';

  container.innerHTML = html;
  queueFit();
  scrollAgendaToNow();
}

/* abre já no horário atual (se hoje estiver na tela) ou no começo do dia */
let agendaScrolled = false;
function scrollAgendaToNow(){
  const wrap = document.querySelector('.cal-wrap');
  if(!wrap || agendaScrolled || !wrap.clientHeight) return;
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const target = localDateString(now);
  const visible = document.querySelector(`.c[data-date="${target}"]`);
  const row = parseFloat(getComputedStyle($('weekly-table')).getPropertyValue('--row')) || 3.3;
  agendaScrolled = true;
  if(!visible || mins < 9 * 60) return;
  const slotsPassed = Math.max(0, Math.min(SLOTS.length - 1, Math.floor((mins - 8 * 60) / 30) - 1));
  wrap.style.scrollBehavior = 'auto';
  wrap.scrollTop = slotsPassed * row * parseFloat(getComputedStyle(document.documentElement).fontSize);
  wrap.style.scrollBehavior = '';
}

/* Ctrl + roda do mouse: aumenta/diminui a altura das linhas da agenda */
let rowRem = 3.3;
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.querySelector('.cal-wrap');
  if(!wrap) return;
  wrap.addEventListener('wheel', e => {
    if(!e.ctrlKey) return;
    e.preventDefault();
    rowRem = Math.max(2.2, Math.min(6, rowRem + (e.deltaY < 0 ? .3 : -.3)));
    $('weekly-table').style.setProperty('--row', rowRem + 'rem');
    queueFit();
  }, {passive:false});
});

  if(file.size > 2*1024*1024){
    alert('Escolha uma imagem menor que 2MB.');
    event.target.value='';
    return;
  }

  const reader=new FileReader();
  reader.onload=async ()=>{
    const dataUrl = reader.result;
    applySavedLogo(dataUrl);

    if(!db) return;

    try{
      const {error} = await db.from('app_settings').update({logo_data:dataUrl}).eq('id',1);
      if(error) throw error;
    }catch(error){
      alert('A logo mudou aqui, mas não foi possível salvar para todo mundo: ' + error.message);
    }
  };
  reader.readAsDataURL(file);
}

function meetingConflict(candidate, editingId = ''){
  const start = minutes(candidate.start);
  const end = minutes(candidate.end);

  if(end <= start){
    return 'O horário final deve ser maior que o horário inicial.';
  }

  const base = dateFromInput(candidate.date);

  for(let i=0;i<366;i++){
    const day = localDateString(addDays(base,i));

    if(!meetingOccursOnDate(candidate, day)) continue;

    for(const existing of meetings){
      if(editingId && String(existing.id) === String(editingId)) continue;
      if(existing.status === 'rejected') continue;
      if(!meetingOccursOnDate(existing, day)) continue;

      if(start < minutes(existing.end) && end > minutes(existing.start)){
        return `Conflito com "${existing.title}" em ${day.split('-').reverse().join('/')} (${String(existing.start).slice(0,5)}-${String(existing.end).slice(0,5)}).`;
      }
    }
  }

  return null;
}

const NO_PERMISSION_MSG = 'O servidor não permitiu esta alteração (nenhuma linha foi modificada). Verifique as policies de UPDATE/DELETE da tabela no Supabase.';

async function saveMeeting(event){
  event.preventDefault();

  if(!db || !currentUser){
    alert('Você precisa estar logado para salvar.');
    return;
  }

  const id = $('m-id').value;
  const ownerName = currentUserDisplayName();

  const data = {
    title: $('m-title').value.trim(),
    owner: id ? $('m-owner-display').value : ownerName,
    team: $('m-team-select').value,
    category: $('m-category').value,
    attendees_count: parseInt($('m-attendees').value, 10) || 1,
    participants: $('m-participants').value.trim(),
    date: $('m-date').value,
    start: $('m-start').value,
    end: $('m-end').value,
    recurrence: $('m-recurrence').value
  };

  if(!id){
    data.requested_by = currentUser.id;
    data.requested_by_name = ownerName;
    data.requested_by_email = currentUser.email;
    data.status = currentProfile?.is_admin ? 'approved' : 'pending';
  }

  if(!data.title || !data.date || !data.start || !data.end){
    alert('Preencha todos os campos obrigatórios.');
    return;
  }

  const conflict = meetingConflict(data, id);
  if(conflict){
    alert(conflict);
    return;
  }

  try{
    let response;

    if(id){
      response = await db.from('meetings').update(data).eq('id', id).select();
      if(!response.error && !(response.data && response.data.length)) throw new Error(NO_PERMISSION_MSG);
      if(!response.error) response.data = response.data[0];
    }else{
      response = await db.from('meetings').insert([data]).select().single();
    }

    if(response.error) throw response.error;

    closeMeetingModal();
    await loadData();

    if(!id && !currentProfile?.is_admin){
      notifyAdminByEmail(response.data);
      alert('Solicitação enviada! O administrador vai revisar e aprovar.');
    }

  }catch(error){
    console.error(error);
    alert('Erro ao salvar reunião: ' + error.message);
  }
}

function notifyAdminByEmail(meeting){
  const subject = encodeURIComponent(`Nova solicitação de reunião: ${meeting.title}`);

    `Título: ${meeting.title}\n` +
    `Solicitante: ${meeting.requested_by_name} (${meeting.requested_by_email})\n` +
    `Reunião com: ${categoryLabel(meeting.category)}\n` +

function seatOccursOnDate(allocation, targetDate){
  const start = dateFromInput(allocation.startDate);
  const target = dateFromInput(targetDate);

  if(target < start) return false;

  const day = target.getDay();

  if(allocation.exceptDay && allocation.exceptDay !== 'none' && Number(allocation.exceptDay) === day){
    return false;
  }

  switch(allocation.recurrence || 'daily'){
    case 'single':
      return allocation.startDate === targetDate;
    case 'daily':
      return day >= 1 && day <= 5;
    case 'weekly':
      return day === start.getDay();
    case 'biweekly':{
      const difference = Math.floor((target-start) / 86400000);
      return difference >= 0 && difference % 14 === 0;
    }
    default:
      return false;
  }
}

function storageTableId(table, period){
  return `${table}__${period}`;
}

function getSeatOccupant(table, seat, date, period = 'morning'){
  const currentTableId = storageTableId(table, period);

  return seatAllocations
    .filter(allocation =>
      String(allocation.seatCode) === String(seat) &&
      (
        String(allocation.tableId) === currentTableId ||
        (period === 'morning' && String(allocation.tableId) === String(table))
      ) &&
      seatOccursOnDate(allocation,date)
    )
    .sort((a,b) => String(b.startDate).localeCompare(String(a.startDate)))[0] || null;
}

    return `<div class="half${a ? ' occ' : ''}" data-p="${p === 'morning' ? 'M' : 'T'}" title="${(p === 'morning' ? 'Manhã: ' : 'Tarde: ') + esc(a ? a.collabName : 'Livre')}" onclick="openSeatModal('${table}','${code}','${p}')">${a ? esc(shortName(a.collabName)) : 'Livre'}</div>`;
  };
  const chair = (table, code) => {
    if(seatShift === 'both') return `<div class="ch split">${half(table, code, 'morning')}${half(table, code, 'afternoon')}</div>`;
    const a = getSeatOccupant(table, code, date, seatShift);
    return `<div class="ch${a ? ' occ' : ''}" title="${esc(a ? a.collabName : 'Livre')}" onclick="openSeatModal('${table}','${code}','${seatShift}')">${a ? esc(shortName(a.collabName)) : 'Livre'}</div>`;
  };

  $('seat-groups').innerHTML = SEAT_GROUPS.map(g => `
    <div class="grp">
      <div class="row">${g.top.map(c => chair(g.id, c)).join('')}</div>

      <div class="row">${g.bottom.map(c => chair(g.id, c)).join('')}</div>

function seatConflict(candidate, editingId = ''){
  const base = dateFromInput(candidate.startDate);

  for(let i=0;i<366;i++){
    const day = localDateString(addDays(base,i));
    if(!seatOccursOnDate(candidate,day)) continue;

    for(const existing of seatAllocations){
      if(editingId && String(existing.id) === String(editingId)) continue;
      if(String(existing.tableId) !== String(candidate.tableId)) continue;
      if(String(existing.seatCode) !== String(candidate.seatCode)) continue;
      if(String(existing.period || 'morning') !== String(candidate.period || 'morning')) continue;
      if(seatOccursOnDate(existing,day)) return true;
    }
  }

  return false;
}

async function saveSeatAllocation(event){
  event.preventDefault();

  if(!db){
    alert('Supabase indisponível.');
    return;
  }

  const id = $('s-existing-id').value;
  const table = $('s-table-id').value;
  const chosen = $('s-period').value || 'morning';
  const current = id ? seatAllocations.find(a => String(a.id) === String(id)) : null;
  const currentPeriod = current ? (current.period || 'morning') : null;
  const periods = chosen === 'both' ? ['morning','afternoon'] : [chosen];

  const jobs = periods.map(period => ({
    period,
    editId: (id && currentPeriod === period) ? id : '',
    data: {
      tableId: storageTableId(table, period),
      seatCode: $('s-seat-code').value,
      collabName: $('s-collab-select').value,
      startDate: $('s-start-date').value,
      recurrence: $('s-recurrence').value,
      exceptDay: $('s-except-day').value,
      period
    }
  }));

  if(!jobs[0].data.collabName || !jobs[0].data.startDate){
    alert('Preencha colaborador e data.');
    return;
  }

  /* se estava editando um período e trocou para outro, o registro antigo é movido */
  if(id && !jobs.some(j => j.editId)) jobs[0].editId = id;

  for(const j of jobs){
    if(seatConflict(j.data, j.editId)){
      alert(`Este assento já possui uma alocação conflitante no período da ${j.period === 'morning' ? 'manhã' : 'tarde'}.`);
      return;
    }
  }

  const write = async (data, editId) => editId
    ? db.from('seat_allocations').update(data).eq('id', editId).select().single()
    : db.from('seat_allocations').insert([data]).select().single();

  try{
    for(const j of jobs){
      let response = await write(j.data, j.editId);
      if(response.error){
        const message = String(response.error.message || '').toLowerCase();
        if(message.includes('period') || message.includes('column') || message.includes('schema cache')){
          const fallbackData = {...j.data};
          delete fallbackData.period;
          response = await write(fallbackData, j.editId);
        }
      }
      if(response.error) throw response.error;
    }

    closeSeatModal();
    await loadData();

  }catch(error){
    console.error(error);
    alert('Erro ao salvar assento: ' + error.message);
  }
}

  ['meeting-modal','seat-modal','collab-modal','users-modal'].forEach(id => {
    const m = $(id);
    if(m && m.style.display === 'flex') m.style.display = 'none';
  });
});

/* Arrastar na agenda para escolher um intervalo (como no Google Agenda) */

let slotDrag = null;
let suppressSlotClick = false;

function paintSlotDrag(){
  document.querySelectorAll('.c.sel').forEach(el => el.classList.remove('sel'));
  if(!slotDrag) return;
  const a = Math.min(slotDrag.from, slotDrag.to);
  const b = Math.max(slotDrag.from, slotDrag.to);
  document.querySelectorAll(`.c[data-date="${slotDrag.date}"]`).forEach(el => {
    const i = Number(el.dataset.hi);
    if(i >= a && i <= b) el.classList.add('sel');
  });
}

function initAgendaDrag(){
  const cal = $('weekly-table');
  if(!cal) return;

  cal.addEventListener('click', e => {
    const ev = e.target.closest('.ev');
    if(!ev) return;
    e.stopPropagation();
    openMeetingById(ev.dataset.id);
  });

  cal.addEventListener('mousedown', e => {
    if(e.button !== 0 || e.target.closest('.ev')) return;
    const cell = e.target.closest('.c');
    if(!cell) return;
    const hi = Number(cell.dataset.hi);
    slotDrag = {date:cell.dataset.date, from:hi, to:hi, moved:false};
  });

  cal.addEventListener('mouseover', e => {
    if(!slotDrag) return;
    const cell = e.target.closest('.c');
    if(!cell || cell.dataset.date !== slotDrag.date) return;
    const hi = Number(cell.dataset.hi);
    if(hi === slotDrag.to) return;
    slotDrag.to = hi;
    if(hi !== slotDrag.from) slotDrag.moved = true;
    if(slotDrag.moved) paintSlotDrag();
  });

  document.addEventListener('mouseup', () => {
    if(!slotDrag) return;
    const d = slotDrag;
    slotDrag = null;
    paintSlotDrag();
    if(!d.moved) return;

    suppressSlotClick = true;
    setTimeout(() => { suppressSlotClick = false; }, 0);

    const a = Math.min(d.from, d.to);
    const b = Math.max(d.from, d.to);
    const endMin = SLOTS[b] + 30;
    if(endMin > 19 * 60) return;
    openMeetingModal({date:d.date, start:fmtTime(SLOTS[a]), end:fmtTime(endMin)});
  });
}

/* =========================
   SELETOR DE HORÁRIO
   (lista em passos de 15 min, digitação livre, duração no "Fim",
    horários ocupados marcados, fim acompanha o início)
========================= */

const TIME_STEP = 15;
const TIME_MIN = 8 * 60;
const TIME_MAX = 19 * 60;

const fmtTime = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;

function fmtDuration(m){
  if(m < 60) return `${m} min`;
  const h = Math.floor(m / 60);
  const r = m % 60;
  return r ? `${h} h ${r} min` : `${h} h`;
}

function parseTime(raw){
  const s = String(raw || '').trim().toLowerCase().replace('h', ':').replace(/\s/g, '');
  let h, m, match;
  if((match = s.match(/^(\d{1,2}):(\d{1,2})$/))){ h = +match[1]; m = +match[2]; }
  else if((match = s.match(/^(\d{1,2}):?$/))){ h = +match[1]; m = 0; }
  else if((match = s.match(/^(\d{3,4})$/))){ h = +match[1].slice(0, -2); m = +match[1].slice(-2); }
  else return null;
  if(h > 23 || m > 59) return null;
  return h * 60 + m;
}

const tp = {input:null, kind:null, items:[], active:-1, open:false, dirty:false};
let prevStartMin = null;

function tpBusyIntervals(){
  const date = $('m-date').value;
  const id = $('m-id').value;
  if(!date) return [];
  return meetings
    .filter(m => m.status !== 'rejected' && String(m.id) !== String(id) && meetingOccursOnDate(m, date))
    .map(m => [minutes(m.start), minutes(m.end)]);
}

function tpBuildItems(kind){
  const startMin = parseTime($('m-start').value);
  const busy = tpBusyIntervals();
  const list = [];

  if(kind === 'start'){
    for(let t = TIME_MIN; t < TIME_MAX; t += TIME_STEP) list.push(t);
  }else{
    const first = startMin === null ? TIME_MIN + TIME_STEP : (Math.floor(startMin / TIME_STEP) + 1) * TIME_STEP;
    for(let t = first; t <= TIME_MAX; t += TIME_STEP) list.push(t);
  }

  const cur = parseTime(tp.input.value);
  if(cur !== null && !list.includes(cur) && (kind === 'start' || startMin === null || cur > startMin)){
    list.push(cur);
    list.sort((a, b) => a - b);
  }

  return list.map(t => ({
    t,
    busy: kind === 'start'
      ? busy.some(([s, e]) => t < e && t + TIME_STEP > s)
      : (startMin !== null && busy.some(([s, e]) => startMin < e && t > s)),
    label: (kind === 'end' && startMin !== null) ? fmtDuration(t - startMin) : ''
  }));
}

function tpNearest(value){
  if(value === null || !tp.items.length) return -1;
  let best = 0;
  tp.items.forEach((it, i) => {
    if(Math.abs(it.t - value) < Math.abs(tp.items[best].t - value)) best = i;
  });
  return best;
}

function tpRender(){
  const pop = $('time-popover');
  const cur = parseTime(tp.input.value);
  pop.innerHTML = tp.items.map((it, i) =>
    `<div class="time-opt${it.t === cur ? ' selected' : ''}${it.busy ? ' busy' : ''}${i === tp.active ? ' active' : ''}" data-i="${i}">${fmtTime(it.t)}<small>${it.busy ? 'ocupado' : it.label}</small></div>`
  ).join('') || '<div class="time-opt busy"><small>Sem horários disponíveis</small></div>';
}

function tpPosition(){
  const pop = $('time-popover');
  const r = tp.input.getBoundingClientRect();
  const below = window.innerHeight - r.bottom;
  const above = r.top;

  pop.style.minWidth = Math.max(150, r.width) + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + 'px';

  if(below < 250 && above > below){
    pop.style.top = 'auto';
    pop.style.bottom = (window.innerHeight - r.top + 4) + 'px';
    pop.style.maxHeight = Math.min(240, above - 12) + 'px';
  }else{
    pop.style.bottom = 'auto';
    pop.style.top = (r.bottom + 4) + 'px';
    pop.style.maxHeight = Math.min(240, below - 12) + 'px';
  }
}

function tpCenterActive(){
  const pop = $('time-popover');
  const el = pop.querySelector('.time-opt.active') || pop.querySelector('.time-opt.selected');
  if(!el){ pop.scrollTop = 0; return; }
  pop.scrollTop = el.offsetTop - pop.clientHeight / 2 + el.offsetHeight / 2;
}

function tpEnsureVisible(){
  const pop = $('time-popover');
  const el = pop.querySelector('.time-opt.active');
  if(!el) return;
  if(el.offsetTop < pop.scrollTop + 6) pop.scrollTop = el.offsetTop - 6;
  else if(el.offsetTop + el.offsetHeight > pop.scrollTop + pop.clientHeight - 6){
    pop.scrollTop = el.offsetTop + el.offsetHeight - pop.clientHeight + 6;
  }
}

function tpOpen(input){
  if(input.disabled) return;
  tp.input = input;
  tp.kind = input.id === 'm-start' ? 'start' : 'end';
  tp.items = tpBuildItems(tp.kind);
  tp.active = tpNearest(parseTime(input.value));
  tp.dirty = false;
  tpRender();
  $('time-popover').classList.add('open');
  tp.open = true;
  tpPosition();
  tpCenterActive();
}

function tpClose(){
  $('time-popover').classList.remove('open');
  tp.open = false;
}

function tpValidateEnd(){
  const s = parseTime($('m-start').value);
  const e = parseTime($('m-end').value);
  $('m-end').classList.toggle('invalid', s !== null && e !== null && e <= s);
}

function tpCommit(kind, t){
  const input = kind === 'start' ? $('m-start') : $('m-end');
  input.value = fmtTime(t);
  input.dataset.valid = input.value;
  input.classList.remove('invalid');

  if(kind === 'start'){
    const endMin = parseTime($('m-end').value);
    let newEnd;
    if(prevStartMin === null && endMin !== null && endMin > t) newEnd = endMin;
    else{
      const duration = (endMin !== null && prevStartMin !== null && endMin > prevStartMin) ? endMin - prevStartMin : 60;
      newEnd = Math.min(t + duration, 24 * 60 - 1);
    }
    prevStartMin = t;
    $('m-end').value = fmtTime(newEnd);
    $('m-end').dataset.valid = $('m-end').value;
  }
  tpValidateEnd();
}

function tpSyncFromInputs(){
  ['m-start','m-end'].forEach(id => {
    const el = $(id);
    el.dataset.valid = el.value;
    el.classList.remove('invalid');
  });
  prevStartMin = parseTime($('m-start').value);
}

function tpMove(dir){
  let i = tp.active;
  do{ i += dir; }while(i >= 0 && i < tp.items.length && tp.items[i].busy);
  if(i < 0 || i >= tp.items.length) return;
  tp.active = i;
  tp.dirty = false;
  tpRender();
  tpEnsureVisible();
}

function tpFinish(input){
  const kind = input.id === 'm-start' ? 'start' : 'end';
  const it = tp.items[tp.active];
  const typed = parseTime(input.value);
  let t = null;
  if(tp.dirty && typed !== null) t = typed;
  else if(it && !it.busy) t = it.t;
  else t = typed;
  if(t === null) return;
  tpCommit(kind, t);
  tpClose();
  if(kind === 'start') $('m-end').focus();
}

function tpKeydown(e, input){
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if(!tp.open || tp.input !== input) tpOpen(input);
    tpMove(e.key === 'ArrowDown' ? 1 : -1);
  }else if(e.key === 'Enter'){
    e.preventDefault();
    if(!tp.open || tp.input !== input) tpOpen(input);
    tpFinish(input);
  }else if(e.key === 'Escape' && tp.open){
    e.stopPropagation();
    input.value = input.dataset.valid || input.value;
    tpClose();
  }
}

function tpBlur(input){
  const raw = input.value.trim();
  if(raw){
    const t = parseTime(raw);
    if(t !== null) tpCommit(input.id === 'm-start' ? 'start' : 'end', t);
    else input.value = input.dataset.valid || '';
  }
  tpClose();
}

function initTimePickers(){
  const pop = $('time-popover');

  ['m-start','m-end'].forEach(id => {
    const input = $(id);

    input.addEventListener('focus', () => {
      tpOpen(input);
      setTimeout(() => input.select(), 0);
    });
    input.addEventListener('click', () => {
      if(!tp.open || tp.input !== input) tpOpen(input);
    });
    input.addEventListener('input', () => {
      if(!tp.open || tp.input !== input) tpOpen(input);
      input.classList.remove('invalid');
      tp.dirty = true;
      const t = parseTime(input.value);
      if(t !== null){
        tp.active = tpNearest(t);
        tpRender();
        tpCenterActive();
      }
    });
    input.addEventListener('keydown', e => tpKeydown(e, input));
    input.addEventListener('blur', () => tpBlur(input));
  });

  pop.addEventListener('mousedown', e => e.preventDefault());
  pop.addEventListener('click', e => {
    const opt = e.target.closest('.time-opt[data-i]');
    if(!opt) return;
    const it = tp.items[Number(opt.dataset.i)];
    if(!it || it.busy) return;
    const kind = tp.kind;
    tpCommit(kind, it.t);
    tpClose();
    if(kind === 'start') $('m-end').focus();
  });

  document.addEventListener('scroll', e => {
    if(tp.open && !pop.contains(e.target)) tpClose();
  }, true);
  window.addEventListener('resize', () => { if(tp.open) tpClose(); });
}
